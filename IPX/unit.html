<style>
*{box-sizing:border-box}
body{margin:0;min-height:100vh;font-family:Arial,Helvetica,sans-serif;background:#111;color:#fff;display:flex;align-items:center;justify-content:center;padding:24px}
.page{width:min(760px,100%);background:rgba(25,25,25,.96);border:1px solid rgba(255,255,255,.15);border-radius:18px;padding:32px;box-shadow:0 20px 60px rgba(0,0,0,.45)}
.top{display:flex;align-items:center;justify-content:space-between;gap:20px;margin-bottom:28px}
h1{margin:0;font-size:32px}
.back{color:#fff;text-decoration:none;border:1px solid rgba(255,255,255,.2);padding:10px 16px;border-radius:10px}
.grid{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:14px}
.item{padding:18px;border-radius:12px;background:rgba(255,255,255,.06);border:1px solid rgba(255,255,255,.08)}
.label{font-size:12px;text-transform:uppercase;letter-spacing:.12em;opacity:.6;margin-bottom:7px}
.value{font-size:20px;font-weight:600}
.status{display:inline-flex;align-items:center;gap:9px}
.dot{width:12px;height:12px;border-radius:50%;display:inline-block;background:#22c55e}
.note{margin-top:24px;text-align:center;opacity:.65}
.hold{display:block;margin:24px auto 0;width:100%;padding:15px;border:0;border-radius:12px;background:#fff;color:#111;font-size:16px;font-weight:700;cursor:pointer}
@media(max-width:560px){.grid{grid-template-columns:1fr}.top{align-items:flex-start;flex-direction:column}}
</style>
</head>

async function loadStatus() {
  if (!id) return;
  const { data: unit, error } = await supabase
    .from('units')
    .select('status_id')
    .eq('unit_number', Number(id))
    .maybeSingle();

  const { data: status } = await supabase
    .from('status_categories')
    .select('name,color')
    .eq('id', unit.status_id)
    .maybeSingle();
