<!DOCTYPE html>
<html lang="en">

<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Eldeco Viviana Select</title>
  <link rel="stylesheet" href="style.css">

  <style>
    /* =====================================
       RESET
    ===================================== */
    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
    }

    html,
    body {
      width: 100%;
      height: 100%;
      overflow: hidden;
      background: #F4F7F5;
      font-family: Arial, Helvetica, sans-serif;
    }

    /* =====================================
       CONTAINER - full viewport, zero padding
    ===================================== */
    .floor-container {
      position: fixed;
      inset: 0;
      width: 100vw;
      height: 100vh;
      overflow: hidden;
    }

    /* =====================================
       RESPONSIVE IMAGE STAGE - MATCH REFERENCE FRONT
       4Floor.png is 2303 x 4096 (portrait).

       Landscape / wider viewport: image uses 100vw and height stays auto.
       Portrait / taller viewport: image uses 100vh and width stays auto.

       The stage and SVG always use the exact same aspect ratio, so the
       clickable SVG paths remain pixel-locked to the floor-plan image.
    ===================================== */
    :root {
      --plan-w: 2303;
      --plan-h: 4096;
    }

    .floor-stage {
      position: absolute;
      top: 50%;
      left: 50%;
      transform: translate(-50%, -50%);
      width: 100vw;
      height: auto;
      aspect-ratio: var(--plan-w) / var(--plan-h);
    }

    /* Taller/narrower viewport: fit the image to viewport height,
       keeping its natural width (exactly like the reference .Front). */
    @media (max-aspect-ratio: 2303/4096) {
      .floor-stage {
        width: auto;
        height: 100vh;
      }
    }

    /* =====================================
       IMAGE + SVG - same box, same pixels
    ===================================== */
    #floorImage,
    #floorSVG {
      position: absolute;
      inset: 0;
      width: 100%;
      height: 100%;
      display: block;
    }

    #floorImage {
      width: 100%;
      height: 100%;
      object-fit: fill;
      user-select: none;
      pointer-events: none;
    }

    #floorSVG {
      z-index: 10;
    }

    /* =====================================
       CLICKABLE UNITS
    ===================================== */
    #floorSVG .unit {
      fill: rgba(255, 255, 255, 0.001);
      stroke: transparent;
      stroke-width: 3;
      cursor: pointer;
      pointer-events: all;
      transition: fill .25s ease, stroke .25s ease, filter .25s ease;
    }

    #floorSVG .unit:hover {
      fill: rgba(22, 128, 61, .32);
      stroke: #16803D;
      filter: drop-shadow(0 0 8px rgba(22, 128, 61, .85)) drop-shadow(0 0 20px rgba(22, 128, 61, .5)) !important;
    }

    #floorSVG .unit:active,
    #floorSVG .unit.active {
      fill: rgba(22, 128, 61, .55);
    }

    /* =====================================================================
       TOP BAR - white glass panels, green accents.
       Replaces the old <header>, #legend text, .back-btn and #timer.
       #tooltip stays OUTSIDE #eldTopBar: it is position:fixed and
       cursor-following, so nesting it inherits the bar's stacking context.
    ===================================================================== */
    #eldTopBar {
      position: fixed;
      top: 16px;
      left: 16px;
      right: 16px;
      z-index: 130;
      display: flex;
      align-items: flex-start;
      justify-content: space-between;
      gap: 12px;
      pointer-events: none;
      /* clicks pass through the gap to the plan */
      transition: opacity .18s ease;
    }

    .eldBar-panel {
      display: flex;
      align-items: center;
      gap: 10px;
      pointer-events: auto;
      padding: 8px 12px;
      background: rgba(255, 255, 255, .92);
      border: 1px solid #E1E8E3;
      border-radius: 14px;
      box-shadow: 0 8px 26px rgba(20, 35, 26, .14);
      backdrop-filter: blur(12px) saturate(1.1);
      -webkit-backdrop-filter: blur(12px) saturate(1.1);
    }

    .eldBar-div {
      width: 1px;
      height: 20px;
      flex: 0 0 auto;
      background: #E1E8E3;
    }

    /* ---------- back button ---------- */
    #eldBackBtn {
      display: inline-flex;
      align-items: center;
      gap: 7px;
      padding: 8px 14px 8px 11px;
      border: 1px solid #E1E8E3;
      border-radius: 10px;
      background: #fff;
      color: #14231A;
      font: 700 13px Arial, sans-serif;
      line-height: 1;
      cursor: pointer;
      transition: background .18s ease, color .18s ease, border-color .18s ease, transform .15s ease;
    }

    #eldBackBtn svg {
      display: block;
    }

    #eldBackBtn:hover {
      background: #E7F4EC;
      color: #0E5C2C;
      border-color: #16803D;
      transform: translateX(-1px);
    }

    #eldBackBtn:focus-visible {
      outline: 2px solid #16803D;
      outline-offset: 2px;
    }

    /* ---------- plot label ---------- */
    .eldBar-plot {
      padding: 0 2px;
      font: 800 13px Arial, sans-serif;
      letter-spacing: -.01em;
      color: #0E5C2C;
      white-space: nowrap;
    }

    /* ---------- availability toggle (now lives in the bar) ---------- */
    #availabilityToggle {
      position: static;
      display: inline-flex;
      align-items: center;
      padding: 8px 14px;
      border: 1px solid #E1E8E3;
      border-radius: 10px;
      background: #fff;
      color: #14231A;
      font: 700 13px Arial, sans-serif;
      line-height: 1;
      cursor: pointer;
      box-shadow: none;
      transition: background .18s ease, color .18s ease, border-color .18s ease;
    }

    /* status dot MUST be a pseudo-element: updateAvailabilityButton()
       sets btn.textContent, which wipes any child nodes */
    #availabilityToggle::before {
      content: "";
      width: 8px;
      height: 8px;
      margin-right: 8px;
      flex: 0 0 auto;
      border-radius: 50%;
      background: #16803D;
      box-shadow: 0 0 0 3px rgba(22, 128, 61, .16);
      transition: background .18s ease, box-shadow .18s ease;
    }

    #availabilityToggle:hover {
      background: #E7F4EC;
      color: #0E5C2C;
      border-color: #16803D;
    }

    #availabilityToggle.off {
      background: #14231A;
      color: #fff;
      border-color: #14231A;
    }

    #availabilityToggle.off::before {
      background: #8A9990;
      box-shadow: 0 0 0 3px rgba(138, 153, 144, .22);
    }

    #availabilityToggle:focus-visible {
      outline: 2px solid #16803D;
      outline-offset: 2px;
    }

    /* ---------- legend as chips ---------- */
    #legend {
      display: flex;
      align-items: center;
      gap: 8px;
      flex-wrap: wrap;
      font-size: 12px;
      color: #14231A;
    }

    /* applyInventory() injects
         <span style="display:inline-flex;align-items:center;gap:6px">
           <i style="width:12px;height:12px;border-radius:3px;background:COLOR">
       Override the geometry with !important - NEVER the background, that is
       the live Supabase status colour. */
    #legend>span {
      gap: 7px !important;
      padding: 6px 11px 6px 9px;
      border: 1px solid #E1E8E3;
      border-radius: 999px;
      background: #F4F7F5;
      color: #14231A;
      font-weight: 700;
      white-space: nowrap;
    }

    #legend>span>i {
      width: 9px !important;
      height: 9px !important;
      border-radius: 50% !important;
      flex: 0 0 auto;
      box-shadow: 0 0 0 2.5px rgba(20, 35, 26, .07);
    }

    /* no statuses loaded -> hide the whole panel, no empty pill */
    #eldLegendPanel:has(#legend:empty) {
      display: none;
    }

    #legend.availability-hidden {
      display: none !important;
    }

    /* bar hides itself while the plan modal is open */
    body:has(#planModal.open) #eldTopBar {
      opacity: 0;
      pointer-events: none;
    }

    #eldTopBar.is-hidden {
      opacity: 0;
      pointer-events: none;
    }

    @media (max-width: 768px) {
      #eldTopBar {
        top: 8px;
        left: 8px;
        right: 8px;
        gap: 8px;
        flex-direction: column;
        align-items: stretch;
      }

      .eldBar-panel {
        padding: 6px 9px;
        border-radius: 12px;
        gap: 8px;
      }

      #eldBackBtn {
        padding: 7px 11px 7px 9px;
        font-size: 11px;
      }

      #eldBackBtn span {
        display: none;
      }

      .eldBar-plot {
        font-size: 11px;
      }

      #availabilityToggle {
        padding: 7px 11px;
        font-size: 11px;
        margin-left: auto;
      }

      #legend {
        gap: 6px;
        font-size: 11px;
      }

      #legend>span {
        padding: 5px 9px 5px 7px;
      }
    }

    /* =====================================
       TOOLTIP - white card, green accents
    ===================================== */
    #tooltip {
      position: fixed;
      z-index: 999999 !important;
      pointer-events: none !important;
      opacity: 0;
      min-width: 190px;
      max-width: 60vw;
      padding: 12px 14px;
      border: 1px solid #E1E8E3;
      border-radius: 12px;
      background: rgba(255, 255, 255, .97);
      color: #14231A;
      font-size: 12px;
      line-height: 1.45;
      box-shadow: 0 14px 38px rgba(20, 35, 26, .18);
      backdrop-filter: blur(10px);
      -webkit-backdrop-filter: blur(10px);
      transition: opacity .15s ease;
    }

    #tooltip.show {
      opacity: 1;
    }

    #tooltip .unit-tip-title {
      font-size: 14px;
      font-weight: 800;
      letter-spacing: -.01em;
      color: #0E5C2C;
      margin-bottom: 8px;
      padding-bottom: 7px;
      border-bottom: 1px solid #E1E8E3;
    }

    #tooltip .unit-tip-row {
      display: flex;
      justify-content: space-between;
      gap: 20px;
      margin: 5px 0;
      font-size: 12px;
    }

    #tooltip .unit-tip-row span {
      color: #5B6B61;
      opacity: 1;
    }

    #tooltip .unit-tip-row b {
      font-weight: 700;
      text-align: right;
      color: #14231A;
    }

    #tooltip .unit-tip-status {
      color: #16803D;
    }

    #tooltip .unit-tip-status-row {
      margin-top: 7px;
      padding-top: 7px;
      border-top: 1px solid #E1E8E3;
    }

    /* =====================================
       MOBILE LANDSCAPE
    ===================================== */
    @media (orientation: landscape) and (max-height: 500px) {

      #floorNav,
      .floor-nav,
      #floorSelector,
      .floor-switcher {
        position: fixed !important;
        top: 50% !important;
        right: 6px !important;
        left: auto !important;
        bottom: auto !important;
        transform: translateY(-50%) !important;
        z-index: 200 !important;
      }

      #eldTopBar {
        top: 8px;
        left: 8px;
        right: 8px;
      }

      .eldBar-panel {
        padding: 5px 8px;
      }

      #eldBackBtn {
        padding: 6px 10px;
        font-size: 11px;
      }

      #eldBackBtn span {
        display: none;
      }

      #availabilityToggle {
        padding: 6px 10px;
        font-size: 11px;
      }

      #legend {
        font-size: 10px;
        gap: 5px;
      }

      #tooltip {
        padding: 7px 10px;
        font-size: 11px;
        max-width: 55vw;
      }

      #floorSVG .unit {
        stroke-width: 5;
      }
    }

    /* =====================================
       MOBILE BEHAVIOR
       Keep the floor plan viewport-fitted on phones too. The responsive
       aspect-ratio rules above decide whether width or height controls
       the image size; controls remain overlayed on top of the scene.
    ===================================== */
    @media (max-width: 768px) {
      #floorSVG .unit {
        stroke-width: 4;
      }
    }

    /* =====================================================================
       PLAN MODAL / ROOM BUTTONS / REQUEST TO HOLD - white + green theme
    ===================================================================== */
    #planModal {
      position: fixed;
      inset: 0;
      z-index: 10000;
      display: none;
      background: rgba(20, 35, 26, .55);
      backdrop-filter: blur(10px);
      -webkit-backdrop-filter: blur(10px);
    }

    #planModal.open {
      display: flex;
      flex-direction: column;
      background: #fff;
    }

    .planModal-bar {
      flex: 0 0 auto;
      display: flex;
      align-items: center;
      gap: 14px;
      padding: 14px 20px;
      color: #14231A;
      background: #fff;
      border-bottom: 1px solid #E1E8E3;
      box-shadow: 0 1px 3px rgba(20, 35, 26, .05);
    }

    .planModal-title {
      font-size: 17px;
      font-weight: 800;
      letter-spacing: -.01em;
      white-space: nowrap;
      color: #0E5C2C;
    }

    /* green accent tick before the floor name */
    .planModal-title::before {
      content: "";
      display: inline-block;
      width: 4px;
      height: 16px;
      margin-right: 10px;
      vertical-align: -2px;
      border-radius: 2px;
      background: linear-gradient(180deg, #16803D, #0E5C2C);
    }

    .planModal-meta {
      display: flex;
      gap: 8px;
      flex-wrap: wrap;
      min-width: 0;
      font-size: 12px;
    }

    .planModal-meta span {
      padding: 5px 10px;
      border-radius: 8px;
      background: #F4F7F5;
      border: 1px solid #E1E8E3;
      color: #14231A;
      font-weight: 600;
      white-space: nowrap;
    }

    #planModalClose {
      margin-left: 12px;
      order: 99;
      /* always last, sits beside the Hold button */
      width: 38px;
      height: 38px;
      flex: 0 0 auto;
      display: inline-flex;
      align-items: center;
      justify-content: center;
      border: 1px solid #E1E8E3;
      border-radius: 10px;
      background: #fff;
      color: #5B6B61;
      font-size: 19px;
      line-height: 1;
      cursor: pointer;
      transition: background .18s ease, color .18s ease, border-color .18s ease;
    }

    #planModalClose:hover {
      background: #E7F4EC;
      color: #0E5C2C;
      border-color: #16803D;
    }

    #planModalClose:focus-visible {
      outline: 2px solid #16803D;
      outline-offset: 2px;
    }

    .planModal-body {
      flex: 1 1 auto;
      min-height: 0;
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 0 18px 18px;
      background: radial-gradient(120% 90% at 50% 0%, #FBFDFC 0%, #F4F7F5 60%, #EDF2EE 100%);
    }

    #planModalImg {
      max-width: 100%;
      max-height: 100%;
      width: auto;
      height: auto;
      object-fit: contain;
      border: 1px solid #E1E8E3;
      border-radius: 12px;
      background: #fff;
      box-shadow: 0 18px 48px rgba(20, 35, 26, .16);
    }

    @media (max-width: 768px) {
      .planModal-bar {
        padding: 10px 12px;
        gap: 10px;
        flex-wrap: wrap;
      }

      .planModal-title {
        font-size: 14px;
      }

      .planModal-meta {
        font-size: 11px;
      }

      .planModal-meta span {
        padding: 4px 8px;
      }

      #planModalClose {
        width: 34px;
        height: 34px;
        font-size: 17px;
        border-radius: 9px;
      }

      .planModal-body {
        padding: 0 10px 10px;
      }
    }

    /* =====================================
       PLAN MODAL - DESKTOP = HORIZONTAL
       The unit plan is a portrait drawing (1388 x 2876). On desktop
       it is rotated 90deg so it reads horizontally and fills ~80% of
       the screen. max-width/max-height are SWAPPED on purpose: after
       the rotation the element's width runs down the screen and its
       height runs across it.
       Mobile keeps it vertical (rule: horizontal desktop / vertical mobile).
    ===================================== */
    @media (min-width: 769px) {
      #planModalImg {
        max-width: 80vh;
        /* becomes screen HEIGHT after rotate */
        max-height: 80vw;
        /* becomes screen WIDTH  after rotate */
        transform: rotate(90deg);
      }
    }

    /* =====================================
       ROOM BUTTONS
    ===================================== */
    .planModal-rooms {
      flex: 0 0 auto;
      display: flex;
      gap: 8px;
      flex-wrap: wrap;
      justify-content: center;
      padding: 14px 18px 16px;
      background: #F4F7F5;
      border-top: 1px solid #E1E8E3;
    }

    .roomBtn {
      display: inline-flex;
      flex-direction: column;
      align-items: flex-start;
      gap: 2px;

      padding: 8px 14px;
      border: 1px solid #E1E8E3;
      border-radius: 10px;
      background: #fff;
      color: #14231A;

      font-family: inherit;
      font-size: 13px;
      font-weight: 700;
      line-height: 1.2;

      cursor: pointer;
      box-shadow: 0 1px 2px rgba(20, 35, 26, .05);
      transition: background .18s ease, border-color .18s ease, color .18s ease, transform .15s ease, box-shadow .18s ease;
    }

    .roomBtn small {
      font-size: 10px;
      font-weight: 500;
      color: #5B6B61;
      opacity: 1;
    }

    .roomBtn:hover {
      background: #E7F4EC;
      border-color: #16803D;
      color: #0E5C2C;
      transform: translateY(-1px);
    }

    .roomBtn:hover small {
      color: #0E5C2C;
      opacity: .8;
    }

    .roomBtn:focus-visible {
      outline: 2px solid #16803D;
      outline-offset: 2px;
    }

    .roomBtn.active {
      background: linear-gradient(180deg, #16803D, #0E5C2C);
      border-color: #0E5C2C;
      color: #fff;
      box-shadow: 0 2px 8px rgba(14, 92, 44, .28);
    }

    .roomBtn.active small {
      color: #fff;
      opacity: .8;
    }

    @media (max-width: 768px) {
      .planModal-rooms {
        gap: 6px;
        padding: 10px 10px 12px;
      }

      .roomBtn {
        padding: 6px 10px;
        font-size: 11px;
        border-radius: 8px;
      }

      .roomBtn small {
        font-size: 9px;
      }
    }

    /* popups */
    #popupContainer .card,
    #popupContainer .overlay>div,
    .card {
      width: min(420px, 92vw);
      max-height: 88vh;
      overflow-y: auto;
      padding: 16px 18px;
    }

    /* Request to Hold */
    #requestHoldBtn {
      flex: 0 0 auto;
      margin-left: auto;
      /* groups it with the close button */
      padding: 10px 18px;
      border: 1px solid #0E5C2C;
      border-radius: 10px;
      background: linear-gradient(180deg, #16803D, #0E5C2C);
      color: #fff;
      font: 800 13px Arial, sans-serif;
      letter-spacing: .02em;
      cursor: pointer;
      box-shadow: 0 2px 10px rgba(14, 92, 44, .24);
      transition: filter .18s ease, transform .15s ease, box-shadow .18s ease;
    }

    #requestHoldBtn:hover {
      transform: translateY(-1px);
      filter: brightness(1.08);
      box-shadow: 0 4px 14px rgba(14, 92, 44, .3);
    }

    #requestHoldBtn:focus-visible {
      outline: 2px solid #16803D;
      outline-offset: 2px;
    }

    #requestHoldBtn:disabled {
      opacity: .5;
      cursor: not-allowed;
      transform: none;
      filter: none;
      box-shadow: none;
    }

    #holdConfirmOverlay {
      position: fixed;
      inset: 0;
      z-index: 20000;
      display: none;
      align-items: center;
      justify-content: center;
      background: rgba(20, 35, 26, .5);
      backdrop-filter: blur(8px);
      -webkit-backdrop-filter: blur(8px);
    }

    #holdConfirmOverlay.open {
      display: flex;
    }

    .hold-confirm-card {
      width: min(430px, 90vw);
      background: #fff;
      color: #14231A;
      border: 1px solid #E1E8E3;
      border-radius: 16px;
      padding: 24px;
      box-shadow: 0 24px 70px rgba(20, 35, 26, .25);
      text-align: center;
      font-family: Arial, sans-serif;
    }

    /* green accent bar at the top of the card */
    .hold-confirm-card::before {
      content: "";
      display: block;
      width: 44px;
      height: 4px;
      margin: 0 auto 16px;
      border-radius: 3px;
      background: linear-gradient(90deg, #16803D, #0E5C2C);
    }

    .hold-confirm-card h3 {
      margin: 0 0 8px;
      font-size: 20px;
      font-weight: 800;
      letter-spacing: -.01em;
      color: #0E5C2C;
    }

    .hold-confirm-card p {
      margin: 0 0 20px;
      color: #5B6B61;
      line-height: 1.5;
    }

    .hold-confirm-actions {
      display: flex;
      gap: 10px;
      justify-content: center;
    }

    .hold-confirm-actions button {
      min-width: 100px;
      padding: 11px 18px;
      border-radius: 10px;
      border: 1px solid #E1E8E3;
      font-weight: 700;
      cursor: pointer;
      transition: background .18s ease, color .18s ease, border-color .18s ease, filter .18s ease, transform .15s ease;
    }

    .hold-confirm-actions button:focus-visible {
      outline: 2px solid #16803D;
      outline-offset: 2px;
    }

    #holdYesBtn {
      background: linear-gradient(180deg, #16803D, #0E5C2C);
      color: #fff;
      border-color: #0E5C2C;
      box-shadow: 0 2px 10px rgba(14, 92, 44, .22);
    }

    #holdYesBtn:hover {
      filter: brightness(1.08);
      transform: translateY(-1px);
    }

    #holdNoBtn {
      background: #fff;
      color: #5B6B61;
    }

    #holdNoBtn:hover {
      background: #E7F4EC;
      color: #0E5C2C;
      border-color: #16803D;
    }

    #holdConfirmMsg {
      min-height: 18px;
      margin-top: 12px;
      font-size: 12px;
      color: #b42318;
    }

    @media(max-width:768px) {
      #requestHoldBtn {
        padding: 8px 11px;
        font-size: 11px;
      }

      .hold-confirm-card {
        padding: 20px;
      }
    }
  </style>
</head>

<body>

  <div id="eldTopBar">
    <div class="eldBar-panel">
      <button id="eldBackBtn" type="button" aria-label="Back to site plan">
        <svg viewBox="0 0 24 24" width="15" height="15" aria-hidden="true">
          <path d="M15 5l-7 7 7 7" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round"
            stroke-linejoin="round" />
        </svg>
        <span>Back</span>
      </button>

      <span class="eldBar-div" aria-hidden="true"></span>

      <span class="eldBar-plot" id="eldBarPlot">4 Floor Apartment</span>

      <span class="eldBar-div" aria-hidden="true"></span>

      <button id="availabilityToggle" type="button" aria-pressed="true">Availability ON</button>
    </div>

    <div class="eldBar-panel" id="eldLegendPanel">
      <div id="legend"></div>

  <script>
    /* NOTE: the duplicate apartment_floors/status_categories loader that used to
       live here was removed. It raced applyInventory() for the same dataset,
       ignored status_categories.active, and was dead code anyway - it ran
       before window.supabase existed and bailed at its own guard clause.
       applyInventory() further down is the single source of truth. */

    /* Robust unit hover tooltip */
    (function () {
      const svg = document.getElementById("floorSVG");
      const tip = document.getElementById("tooltip");
      if (!svg || !tip) return;

      function esc(value) {
        return String(value ?? "").replace(/[&<>"]/g, c => ({ "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;" }[c]));
      }

      function getUnit(target) {
        return target && target.closest ? target.closest("path.unit, polygon.unit, rect.unit, g.unit") : null;
      }

      function position(e) {
        const pad = 18;
        let x = e.clientX + pad, y = e.clientY + pad;
        const r = tip.getBoundingClientRect();
        if (x + r.width > window.innerWidth - 10) x = e.clientX - r.width - pad;
        if (y + r.height > window.innerHeight - 10) y = e.clientY - r.height - pad;
        tip.style.left = Math.max(8, x) + "px";
        tip.style.top = Math.max(8, y) + "px";
      }

      function show(e, unit) {
        const floorNumber = unit.getAttribute("data-floor") || unit.dataset.floor || unit.id || "—";
        const availabilityOn = window.ELDECO_SHOW_AVAILABILITY !== false;
        const status = unit.dataset.status || "Available";
        let html = '<div class="unit-tip-title">' + esc(floorNumber) + '</div>';
        if (availabilityOn) {
          html += '<div class="unit-tip-row unit-tip-status-row"><span>Status</span><b class="unit-tip-status">' + esc(status) + '</b></div>';
        }
        tip.innerHTML = html;
        tip.classList.add("show");
        tip.style.display = "block";
        tip.style.pointerEvents = "none";
        position(e);
      }

      svg.addEventListener("pointerover", e => {
        const unit = getUnit(e.target);
        if (unit) show(e, unit);
      }, true);

      svg.addEventListener("pointermove", e => {
        const unit = getUnit(e.target);
        if (unit) position(e);
      }, true);

      svg.addEventListener("pointerout", e => {
        const from = getUnit(e.target);
        const to = getUnit(e.relatedTarget);
        if (from && from !== to) tip.classList.remove("show");
      }, true);

      // Make sure SVG units always receive pointer events.
      svg.querySelectorAll(".unit").forEach(el => {
        el.style.pointerEvents = "all";
        el.style.cursor = "pointer";
      });
    })();
  </script>

  <script>
    /* =====================================
       CLICK A UNIT -> SHOW ITS FLOOR PLAN
    ===================================== */
    (function () {
      var svg = document.getElementById("floorSVG");
      var modal = document.getElementById("planModal");
      var img = document.getElementById("planModalImg");
      var title = document.getElementById("planModalTitle");
      var meta = document.getElementById("planModalMeta");
      var tip = document.getElementById("tooltip");
      var requestHoldBtn = document.getElementById("requestHoldBtn");
      var holdOverlay = document.getElementById("holdConfirmOverlay");
      var holdText = document.getElementById("holdConfirmText");
      var holdYesBtn = document.getElementById("holdYesBtn");
      var holdNoBtn = document.getElementById("holdNoBtn");
      var holdMsg = document.getElementById("holdConfirmMsg");
      var selectedDetails = null;

      function planFor(details) {
        var size = String(details.totalArea || "").split(" ")[0].replace(/,/g, "");
        return window.planImages[size] || window.planImages["default"];
      }

      function open(details) {
        selectedDetails = details;

        /* the 360 tour reads this for its balcony floor stack. It used to be
           parsed off document.title, which has no digits, so it never got set. */
        var floorDigits = String(details.floor || details.unit || "").replace(/\D/g, "");
        if (floorDigits) sessionStorage.setItem("selectedFloor", ("0" + floorDigits).slice(-2));
        title.textContent = details.floor || details.unit || "Floor";
        /* unitDetails defines `width`, never `breadth` - fall back or we print undefined */
        meta.innerHTML =
          "<span>Total Area: " + (details.totalArea || "\—") + "</span>" +
          "<span>Length: " + (details.length || "\—") + "</span>" +
          "<span>Breadth: " + (details.breadth || details.width || "\—") + "</span>";

        img.src = planFor(details);
        img.alt = (details.unit || "Unit") + " floor plan";
        requestHoldBtn.disabled = false;
        requestHoldBtn.textContent = "Request to Hold";

        modal.classList.add("open");
        modal.setAttribute("aria-hidden", "false");
        if (typeof window.clearRoomSelection === "function") window.clearRoomSelection();
        if (tip) tip.classList.remove("show");
      }

      function close() {
        closeHoldConfirm();
        modal.classList.remove("open");
        modal.setAttribute("aria-hidden", "true");
        img.src = "";
      }

      function closeHoldConfirm() {
        holdOverlay.classList.remove("open");
        holdOverlay.setAttribute("aria-hidden", "true");
        holdMsg.textContent = "";
        holdYesBtn.disabled = false;
        holdNoBtn.disabled = false;
      }

      requestHoldBtn.addEventListener("click", function () {
        if (!selectedDetails) return;
        holdText.textContent = "Do you want to request " + (selectedDetails.unit || "this property") + " to be held?";
        holdMsg.textContent = "";
        holdOverlay.classList.add("open");
        holdOverlay.setAttribute("aria-hidden", "false");
      });

      holdNoBtn.addEventListener("click", closeHoldConfirm);
      holdOverlay.addEventListener("click", function (e) { if (e.target === holdOverlay) closeHoldConfirm(); });

      holdYesBtn.addEventListener("click", async function () {
        if (!selectedDetails) return;
        holdYesBtn.disabled = true; holdNoBtn.disabled = true;
        holdYesBtn.textContent = "Submitting..."; holdMsg.textContent = "";
        try {
          var visitor = {};
          try { visitor = JSON.parse(sessionStorage.getItem("eldecoVisitor") || "{}"); } catch (_) { }
          var plotNumber = new URLSearchParams(window.location.search).get("plot") || "";
          var floorNumber = String(selectedDetails.floor || selectedDetails.unit || "").replace(/^Floor\s*/i, "").trim();
          var payload = {
            unit_number: plotNumber || null,
            property_name: plotNumber ? ("Plot " + plotNumber) : (selectedDetails.unit || "4 Floor Apartment"),
            source_type: "4_floor",
            plot_number: plotNumber || null,
            floor_number: floorNumber || null,
            visitor_name: visitor.name || null,
            visitor_mobile: visitor.mobile || null,
            visitor_email: visitor.email || null,
            visitor_city: visitor.city || null,
            status: "pending"
          };
          var result = await supabase.from("hold_requests").insert(payload);
          if (result.error) throw result.error;
          holdMsg.style.color = "#18794e"; holdMsg.textContent = "Request sent to admin successfully.";
          holdYesBtn.textContent = "Sent";
          setTimeout(closeHoldConfirm, 1200);
        } catch (err) {
          console.error("Hold request failed:", err);
          holdMsg.style.color = "#b42318";
          holdMsg.textContent = err.message || "Unable to send request. Please try again.";
          holdYesBtn.disabled = false; holdNoBtn.disabled = false; holdYesBtn.textContent = "Yes";
        }
      });

      svg.addEventListener("click", function (e) {
        var unit = e.target.closest(".unit");
        if (!unit) return;

        var unitNumber = unit.getAttribute("data-unit") || unit.id;

        // This page is already the 4-floor apartment selector, so every
        // floor SVG opens the same floor-plan overlay.
        var details = Object.assign({}, window.unitDetails[unitNumber] || window.unitDetails[unit.id] || {});
        details.unit = unit.getAttribute("data-floor") || unit.id || ("Floor " + unitNumber);
        details.floor = unit.getAttribute("data-floor") || unit.id || ("Floor " + unitNumber);
        details.plot = new URLSearchParams(window.location.search).get("plot") || "";
        if (!details.unit) return;

        open(details);
      });

      document.getElementById("planModalClose").addEventListener("click", close);

      /* backdrop click closes, image click does not */
      modal.addEventListener("click", function (e) {
        if (e.target === modal || e.target.classList.contains("planModal-body")) close();
      });

      document.addEventListener("keydown", function (e) {
        if (e.key === "Escape" && modal.classList.contains("open")) close();
      });
    })();

  <script type="module">
    let showAvailability = false;
    window.ELDECO_SHOW_AVAILABILITY = false;

    function updateAvailabilityButton() {
      const btn = document.getElementById('availabilityToggle'); if (!btn) return;
      btn.textContent = showAvailability ? 'Availability ON' : 'Availability OFF';
      btn.setAttribute('aria-pressed', String(showAvailability));
      btn.classList.toggle('off', !showAvailability);
      window.ELDECO_SHOW_AVAILABILITY = showAvailability;
    }

    function renderAvailability(el) {
      if (showAvailability && el.dataset.statusColor) {
        el.style.fill = el.dataset.statusColor; el.style.fillOpacity = '.45';
        el.style.stroke = el.dataset.statusColor; el.style.strokeOpacity = '.95';
      } else {
        el.style.fill = 'rgba(255,255,255,0.001)'; el.style.fillOpacity = '1';
        el.style.stroke = 'rgba(20,35,26,0.45)'; el.style.strokeOpacity = '1';
      }
    }

    async function applyInventory() {
      const plotNumber = new URLSearchParams(window.location.search).get('plot') || '';
      if (!plotNumber) return;

      const [floorsResult, statusesResult] = await Promise.all([
        supabase.from('apartment_floors').select('plot_number,floor_number,status_id,buyer_name,buyer_number').eq('plot_number', String(plotNumber)),
        supabase.from('status_categories').select('id,name,color').eq('active', true).order('sort_order')
      ]);

      // If the apartment_floors table is unavailable, do not break the page.
      // The tooltip will simply fall back to Available until the admin data is available.
      if (statusesResult.error) {
        console.warn('Eldeco status load failed', statusesResult.error);
        return;
      }
      if (floorsResult.error) {
        console.warn('Eldeco apartment floor load failed', floorsResult.error);
      }

      const floors = floorsResult.data || [];
      const statuses = statusesResult.data || [];
      const statusMap = new Map(statuses.map(s => [String(s.id), s]));

      const legend = document.getElementById('legend');
      if (legend) {
        legend.innerHTML = '';
        if (showAvailability) statuses.forEach(status => {
          const item = document.createElement('span'); item.style.cssText = 'display:inline-flex;align-items:center;gap:6px';
          const swatch = document.createElement('i'); swatch.style.cssText = 'width:12px;height:12px;border-radius:3px;background:' + status.color;
          item.appendChild(swatch); item.appendChild(document.createTextNode(status.name)); legend.appendChild(item);
        });
      }

      document.querySelectorAll('#floorSVG .unit').forEach(el => {
        const floorLabel = el.getAttribute('data-floor') || el.dataset.floor || el.id || '';
        const floorNumber = floorLabel.replace(/^Floor\s*/i, '').trim();
        const floor = floors.find(f => String(f.floor_number).replace(/^Floor\s*/i, '').trim() === floorNumber);
        const status = floor ? statusMap.get(String(floor.status_id)) : null;

        el.classList.add('unit-live');
        delete el.dataset.status; delete el.dataset.statusColor; delete el.dataset.buyer; delete el.dataset.buyerNumber;

        if (status) {
          el.dataset.status = status.name;
          el.dataset.statusColor = status.color;
          el.dataset.buyer = floor.buyer_name || '';
          el.dataset.buyerNumber = floor.buyer_number || '';
        } else {
          // No admin assignment yet = default to Available in the tooltip.
          el.dataset.status = 'Available';
        }
        renderAvailability(el);
      });
      updateAvailabilityButton();
    }

    document.getElementById('availabilityToggle').addEventListener('click', function () {
      showAvailability = !showAvailability;
      document.getElementById('legend')?.classList.toggle('availability-hidden', !showAvailability);
      window.ELDECO_SHOW_AVAILABILITY = showAvailability;
      document.querySelectorAll('#floorSVG .unit').forEach(renderAvailability);
      updateAvailabilityButton();

      // Refresh the currently visible tooltip immediately so the Status line
      // disappears/reappears without requiring the user to move the mouse.
      const visibleUnit = document.querySelector('#floorSVG .unit:hover');
      if (!showAvailability) {
        const row = document.querySelector('#tooltip .unit-tip-status-row');
        if (row) row.remove();
      } else if (visibleUnit) {
        const title = visibleUnit.getAttribute('data-floor') || visibleUnit.id || 'Floor';
        const status = visibleUnit.dataset.status || 'Available';
        const row = document.createElement('div');
        row.className = 'unit-tip-row unit-tip-status-row';
        row.innerHTML = '<span>Status</span><b class="unit-tip-status">' + String(status).replace(/[&<>"']/g, c => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[c])) + '</b>';
        const tip = document.getElementById('tooltip');
        if (tip && !tip.querySelector('.unit-tip-status-row')) tip.appendChild(row);
      }
    });

    /* Bright hover outline while preserving each unit's live status color. */
    document.querySelectorAll('#floorSVG .unit').forEach(function (el) {
      el.addEventListener('mouseenter', function () {
        el.dataset.originalStrokeWidth = el.style.strokeWidth || '';
        el.style.strokeWidth = '7';
        el.style.filter = 'brightness(1.15) drop-shadow(0 0 7px rgba(22,128,61,.95)) drop-shadow(0 0 18px rgba(22,128,61,.6))';
      });
      el.addEventListener('mouseleave', function () {
        el.style.strokeWidth = el.dataset.originalStrokeWidth || '';
        el.style.filter = '';
      });
    });

    applyInventory();
    supabase.channel('eldeco-live')
      .on('postgres_changes', { event: '*', schema: 'public', table: 'apartment_floors' }, applyInventory)
      .on('postgres_changes', { event: '*', schema: 'public', table: 'status_categories' }, applyInventory)
      .subscribe();
  </script>

      var plot = new URLSearchParams(location.search).get("plot");
      var label = document.getElementById("eldBarPlot");
      if (label) label.textContent = plot ? ("Plot " + plot + " \· 4 Floors") : "4 Floor Apartment";

      var bar = document.getElementById("eldTopBar");
      var modal = document.getElementById("planModal");
      if (bar && modal && window.MutationObserver) {
        new MutationObserver(function () {
          bar.classList.toggle("is-hidden", modal.classList.contains("open"));
        }).observe(modal, { attributes: true, attributeFilter: ["class"] });
      }
    })();
  </script>
</body>

</html>
