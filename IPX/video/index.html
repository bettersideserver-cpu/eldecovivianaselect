<!doctype html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>Video Player</title>
<link rel="preconnect" href="https://fonts.googleapis.com" />
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
<link href="https://fonts.googleapis.com/css2?family=Poppins:wght@400;500;600&display=swap" rel="stylesheet" />
<link rel="stylesheet" href="video.css" />
</head>
<body>

<div class="vp-shell vp-preplay" id="shell">
  <!-- src is set by the CLIPS map in the script below (?clip=tour / ?clip=explore) -->
  <video
    id="video"
    class="vp-video"
    poster=""
    playsinline
    preload="metadata"
  ></video>

  <!-- click surface: click = play/pause, dblclick = fullscreen -->
  <button class="vp-click" id="clickSurface" aria-label="Play or pause"></button>

  <div class="vp-scrim-top"></div>

  <!-- back button: always visible -->
  <button class="vp-back" id="backBtn">
    <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"><path d="M19 12H5"/><path d="M12 19l-7-7 7-7"/></svg>
    <span>Back</span>
  </button>

  <div class="vp-title" id="titleEl">Property Walkthrough</div>

  <!-- buffering spinner -->
  <div class="vp-spinner" id="spinner"></div>

  <!-- center play / replay — the only way playback starts -->
  <button class="vp-center" id="centerBtn" aria-label="Play">
    <svg id="centerIcon" viewBox="0 0 24 24" fill="currentColor"><path d="M8 5v14l11-7z"/></svg>
  </button>

  <!-- unmute nudge (only shows if the user mutes) -->
  <button class="vp-unmute" id="unmuteBtn">
    <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><path d="M11 5 6 9H2v6h4l5 4z"/><path d="M22 9l-6 6M16 9l6 6"/></svg>
    Tap to unmute
  </button>

  <!-- control bar -->
  <div class="vp-controls" id="controls">
    <div class="vp-seek" id="seek">
      <div class="vp-track">
        <div class="vp-buffered" id="bufferedBar"></div>
        <div class="vp-progress" id="progressBar"></div>
        <div class="vp-thumb" id="thumb"></div>
      </div>
      <span class="vp-tip" id="tip"></span>
    </div>

    <div class="vp-row">
      <button class="vp-icon" id="playBtn" aria-label="Play">
        <svg id="playIcon" viewBox="0 0 24 24" fill="currentColor"><path d="M8 5v14l11-7z"/></svg>
      </button>

      <div class="vp-volume">
        <button class="vp-icon" id="muteBtn" aria-label="Mute">
          <svg id="volIcon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><path d="M11 5 6 9H2v6h4l5 4z"/><path d="M15.5 8.5a4 4 0 0 1 0 7M18.5 5.5a8 8 0 0 1 0 13"/></svg>
        </button>
        <input class="vp-vol-range" id="volRange" type="range" min="0" max="1" step="0.02" value="1" aria-label="Volume" />
      </div>

      <span class="vp-time"><span id="curTime">0:00</span><i>/</i><span id="durTime">0:00</span></span>

      <div class="vp-spacer"></div>

      <button class="vp-speed" id="speedBtn">1x</button>

      <button class="vp-icon" id="fsBtn" aria-label="Fullscreen">
        <svg id="fsIcon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><path d="M8 3H5a2 2 0 0 0-2 2v3M16 3h3a2 2 0 0 1 2 2v3M21 16v3a2 2 0 0 1-2 2h-3M3 16v3a2 2 0 0 0 2 2h3"/></svg>
      </button>
    </div>
  </div>
</div>

<script>
(function () {
  var SPEEDS = [0.5, 1, 1.5, 2];
  var shell = document.getElementById("shell");
  var v = document.getElementById("video");
  var seek = document.getElementById("seek");
  var bufferedBar = document.getElementById("bufferedBar");
  var progressBar = document.getElementById("progressBar");
  var thumb = document.getElementById("thumb");
  var tip = document.getElementById("tip");
  var spinner = document.getElementById("spinner");
  var centerBtn = document.getElementById("centerBtn");
  var centerIcon = document.getElementById("centerIcon");
  var playBtn = document.getElementById("playBtn");
  var playIcon = document.getElementById("playIcon");
  var muteBtn = document.getElementById("muteBtn");
  var volIcon = document.getElementById("volIcon");
  var volRange = document.getElementById("volRange");
  var curTime = document.getElementById("curTime");
  var durTime = document.getElementById("durTime");
  var speedBtn = document.getElementById("speedBtn");
  var fsBtn = document.getElementById("fsBtn");
  var fsIcon = document.getElementById("fsIcon");
  var unmuteBtn = document.getElementById("unmuteBtn");
  var clickSurface = document.getElementById("clickSurface");
  var backBtn = document.getElementById("backBtn");
  var titleEl = document.getElementById("titleEl");

  /* ================= WHICH VIDEO PLAYS =================
     One player, many clips. The page is opened as:
        video/index.html?clip=tour                    -> bottom slider (walkthrough)
        video/index.html?clip=explore&plot=Plot%20101 -> Explore button on a plot
     Put your real file names here. Files sit next to this page. */
  var CLIPS = {
    tour:    { src: "videoo.mp4",  title: "Property Walkthrough" },
    explore: { src: "videoo2.mp4", title: "Plot Walkthrough" }
  };
  var DEFAULT_CLIP = "tour";

  (function pickClip() {
    var q = new URLSearchParams(location.search);
    var clip = CLIPS[q.get("clip")] || CLIPS[DEFAULT_CLIP];
    var plot = (q.get("plot") || "").trim();
    var label = plot ? plot + " — " + clip.title : clip.title;
    v.src = clip.src;
    if (titleEl) titleEl.textContent = label;
    document.title = label;
  })();

  var PLAY_PATH = '<path d="M8 5v14l11-7z"/>';
  var PAUSE_PATH = '<path d="M7 4h4v16H7zM13 4h4v16h-4z"/>';
  var REPLAY_SVG = '<path d="M3 12a9 9 0 1 0 3-6.7M3 4v5h5" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/>';
  var VOL_ON = '<path d="M11 5 6 9H2v6h4l5 4z"/><path d="M15.5 8.5a4 4 0 0 1 0 7M18.5 5.5a8 8 0 0 1 0 13"/>';
  var VOL_OFF = '<path d="M11 5 6 9H2v6h4l5 4z"/><path d="M22 9l-6 6M16 9l6 6"/>';
  var FS_IN = '<path d="M8 3H5a2 2 0 0 0-2 2v3M16 3h3a2 2 0 0 1 2 2v3M21 16v3a2 2 0 0 1-2 2h-3M3 16v3a2 2 0 0 0 2 2h3"/>';
  var FS_OUT = '<path d="M8 3v3a2 2 0 0 1-2 2H3M16 3v3a2 2 0 0 0 2 2h3M21 16h-3a2 2 0 0 0-2 2v3M3 16h3a2 2 0 0 1 2 2v3"/>';

  var hideTimer = null, scrubbing = false, speedIdx = 1, started = false;

  function fmt(s) {
    if (!isFinite(s) || s < 0) return "0:00";
    s = Math.floor(s);
    var h = Math.floor(s / 3600), m = Math.floor((s % 3600) / 60), sec = s % 60;
    var pad = function (n) { return n < 10 ? "0" + n : "" + n; };
    return h > 0 ? h + ":" + pad(m) + ":" + pad(sec) : m + ":" + pad(sec);
  }

  function revealUi() {
    shell.classList.remove("vp-hidden");
    clearTimeout(hideTimer);
    hideTimer = setTimeout(function () {
      if (started && !v.paused && !v.ended && !scrubbing) shell.classList.add("vp-hidden");
    }, 2600);
  }

  function syncPlayIcons() {
    var isPlaying = !v.paused && !v.ended;
    playIcon.innerHTML = isPlaying ? PAUSE_PATH : PLAY_PATH;
    playBtn.setAttribute("aria-label", isPlaying ? "Pause" : "Play");
    centerBtn.style.display = isPlaying ? "none" : "grid";
    centerIcon.innerHTML = v.ended ? REPLAY_SVG : PLAY_PATH;
    centerIcon.setAttribute("fill", v.ended ? "none" : "currentColor");
    centerBtn.setAttribute("aria-label", v.ended ? "Replay" : "Play");
  }

  function syncVolume() {
    var off = v.muted || v.volume === 0;
    volIcon.innerHTML = off ? VOL_OFF : VOL_ON;
    volRange.value = off ? 0 : v.volume;
    unmuteBtn.style.display = (off && started && !v.paused) ? "flex" : "none";
  }

  // playback only ever starts from a user click / keypress
  function togglePlay() {
    if (v.ended) { v.currentTime = 0; v.play(); return; }
    if (v.paused) v.play(); else v.pause();
  }

  function seekBy(d) {
    if (!isFinite(v.duration)) return;
    v.currentTime = Math.min(Math.max(v.currentTime + d, 0), v.duration);
  }

  function setVolume(val) {
    v.volume = Math.min(Math.max(val, 0), 1);
    v.muted = v.volume === 0;
    syncVolume();
  }

  function toggleFullscreen() {
    if (document.fullscreenElement) document.exitFullscreen();
    else if (shell.requestFullscreen) shell.requestFullscreen();
  }

  /* ── back with memory ───────────────────────────────── */
  var RETURN_KEY = "vp:returnTo";
  var SCROLL_KEY = "vp:returnScroll";
  var HOME = "index.html"; // last-resort fallback

  function sameOrigin(url) {
    try { return new URL(url, location.href).origin === location.origin; }
    catch (e) { return false; }
  }

  // remember where the user came from (runs once on load)
  (function rememberOrigin() {
    var params = new URLSearchParams(location.search);
    var from = params.get("from");   // ?from=/property.html  (most reliable)
    var scroll = params.get("y");    // ?y=1240 (optional scroll memory)

    if (from && sameOrigin(from)) {
      sessionStorage.setItem(RETURN_KEY, from);
      if (scroll) sessionStorage.setItem(SCROLL_KEY, scroll);
    } else if (!sessionStorage.getItem(RETURN_KEY) && document.referrer && sameOrigin(document.referrer)) {
      sessionStorage.setItem(RETURN_KEY, document.referrer);
    }
  })();

  function goBack() {
    if (document.fullscreenElement) document.exitFullscreen();
    v.pause();

    var target = sessionStorage.getItem(RETURN_KEY);
    var y = sessionStorage.getItem(SCROLL_KEY);

    // 1. remembered page wins
    if (target) {
      sessionStorage.removeItem(RETURN_KEY);
      sessionStorage.removeItem(SCROLL_KEY);
      var u = new URL(target, location.href);
      u.searchParams.set("noform", "1");   // tells that page not to re-open its form
      if (y) u.searchParams.set("y", y);
      location.href = u.href;
      return;
    }

    // 2. real browser history
    if (window.history.length > 1) { window.history.back(); return; }

    // 3. fallback
    location.href = HOME;
  }

  function ratioFrom(clientX) {
    var r = seek.getBoundingClientRect();
    return Math.min(Math.max((clientX - r.left) / r.width, 0), 1);
  }

  function paint() {
    var p = v.duration ? (v.currentTime / v.duration) * 100 : 0;
    progressBar.style.width = p + "%";
    thumb.style.left = p + "%";
    if (v.buffered.length && v.duration) {
      bufferedBar.style.width = ((v.buffered.end(v.buffered.length - 1) / v.duration) * 100 || 0) + "%";
    }
    curTime.textContent = fmt(v.currentTime);
    durTime.textContent = fmt(v.duration);
  }

  /* events */
  v.addEventListener("timeupdate", paint);
  v.addEventListener("progress", paint);
  v.addEventListener("loadedmetadata", paint);
  v.addEventListener("durationchange", paint);
  v.addEventListener("play", function () {
    started = true;
    shell.classList.remove("vp-preplay");
    syncPlayIcons(); syncVolume(); revealUi();
  });
  v.addEventListener("pause", function () {
    syncPlayIcons(); syncVolume();
    clearTimeout(hideTimer);
    shell.classList.remove("vp-hidden");
  });
  v.addEventListener("ended", function () { syncPlayIcons(); shell.classList.remove("vp-hidden"); });
  v.addEventListener("waiting", function () { if (started) spinner.style.display = "block"; });
  v.addEventListener("canplay", function () { spinner.style.display = "none"; });
  v.addEventListener("playing", function () { spinner.style.display = "none"; });
  v.addEventListener("volumechange", syncVolume);

  clickSurface.addEventListener("click", togglePlay);
  clickSurface.addEventListener("dblclick", toggleFullscreen);
  centerBtn.addEventListener("click", togglePlay);
  playBtn.addEventListener("click", togglePlay);
  backBtn.addEventListener("click", goBack);
  unmuteBtn.addEventListener("click", function () { v.muted = false; if (v.volume === 0) v.volume = 1; syncVolume(); });
  muteBtn.addEventListener("click", function () { v.muted = !v.muted; if (!v.muted && v.volume === 0) v.volume = 1; syncVolume(); });
  volRange.addEventListener("input", function () { setVolume(parseFloat(this.value)); });
  fsBtn.addEventListener("click", toggleFullscreen);
  speedBtn.addEventListener("click", function () {
    speedIdx = (speedIdx + 1) % SPEEDS.length;
    v.playbackRate = SPEEDS[speedIdx];
    speedBtn.textContent = SPEEDS[speedIdx] + "x";
  });

  document.addEventListener("fullscreenchange", function () {
    var on = !!document.fullscreenElement;
    fsIcon.innerHTML = on ? FS_OUT : FS_IN;
    fsBtn.setAttribute("aria-label", on ? "Exit fullscreen" : "Fullscreen");
  });

  /* seek bar */
  seek.addEventListener("pointerdown", function (e) {
    if (!isFinite(v.duration)) return;
    scrubbing = true;
    v.currentTime = ratioFrom(e.clientX) * v.duration;
    paint();
  });
  seek.addEventListener("pointermove", function (e) {
    if (!isFinite(v.duration)) return;
    var r = ratioFrom(e.clientX);
    tip.style.left = r * 100 + "%";
    tip.textContent = fmt(r * v.duration);
    tip.style.opacity = 1;
  });
  seek.addEventListener("pointerleave", function () { tip.style.opacity = 0; });
  window.addEventListener("pointermove", function (e) {
    if (!scrubbing || !isFinite(v.duration)) return;
    v.currentTime = ratioFrom(e.clientX) * v.duration;
    paint();
  });
  window.addEventListener("pointerup", function () { scrubbing = false; });

  /* show/hide chrome */
  shell.addEventListener("pointermove", revealUi);
  shell.addEventListener("pointerdown", revealUi);

  /* keyboard */
  window.addEventListener("keydown", function (e) {
    var tag = e.target && e.target.tagName;
    if (tag === "INPUT" || tag === "TEXTAREA") return;
    revealUi();
    switch (e.key) {
      case " ": case "k": case "K": e.preventDefault(); togglePlay(); break;
      case "ArrowRight": e.preventDefault(); seekBy(5); break;
      case "ArrowLeft": e.preventDefault(); seekBy(-5); break;
      case "ArrowUp": e.preventDefault(); setVolume(v.volume + 0.1); break;
      case "ArrowDown": e.preventDefault(); setVolume(v.volume - 0.1); break;
      case "m": case "M": v.muted = !v.muted; syncVolume(); break;
      case "f": case "F": toggleFullscreen(); break;
      case "Escape": if (!document.fullscreenElement) goBack(); break;
    }
  });

  syncPlayIcons(); syncVolume(); paint();
  shell.classList.remove("vp-hidden"); // controls stay visible until playback starts
})();
</script>
</body>
</html>
