<!DOCTYPE html>
<html lang="en">

<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Eldeco Viviana Select</title>
  <link rel="stylesheet" href="style.css">

  <style>
    /* =====================================
       RESET
    ===================================== */
    * { margin: 0; padding: 0; box-sizing: border-box; }

    html, body {
      width: 100%;
      height: 100%;
      overflow: hidden;
      background: #111;
      font-family: Arial, Helvetica, sans-serif;
    }

    /* =====================================
       CONTAINER - full viewport, zero padding
    ===================================== */
    .floor-container {
      position: fixed;
      inset: 0;
      width: 100vw;
      height: 100vh;
      overflow: hidden;
    }

    /* =====================================
       STAGE - COVER MATH
       The stage keeps the SVG ratio (3840 / 2160) and grows with
       max() until it covers the viewport on BOTH axes, then it is
       centred. That is exactly what object-fit: cover does to the
       image, so image and SVG land on the same pixels at any size.
       Want the full plan visible instead? swap max() -> min().
    ===================================== */
    :root {
      --plan-w: 3840;
      --plan-h: 2160;
    }

    .floor-stage {
      position: absolute;
      top: 50%;
      left: 50%;
      transform: translate(-50%, -50%);
      width:  max(100vw, calc(var(--vh, 1vh) * 100 * (var(--plan-w) / var(--plan-h))));
      height: max(calc(var(--vh, 1vh) * 100), calc(100vw * (var(--plan-h) / var(--plan-w))));
    }

    /* =====================================
       IMAGE + SVG - same box, same pixels
    ===================================== */
    #floorImage,
    #floorSVG {
      position: absolute;
      inset: 0;
      width: 100%;
      height: 100%;
      display: block;
    }

    #floorImage {
      object-fit: fill;              /* stage already matches image ratio */
      user-select: none;
      pointer-events: none;
    }

    #floorSVG { z-index: 10; }

    /* =====================================
       CLICKABLE UNITS
    ===================================== */
    #floorSVG .unit {
      fill: rgba(255, 255, 255, 0.001);
      stroke: transparent;
      stroke-width: 3;
      cursor: pointer;
      pointer-events: all;
      transition: fill .25s ease, stroke .25s ease, filter .25s ease;
    }

    #floorSVG .unit:hover {
      fill: rgba(255, 215, 0, .35);
      stroke: #FFD700;
      filter: drop-shadow(0 0 8px #FFD700) drop-shadow(0 0 20px #FFD700) !important;
    }

    #floorSVG .unit:active,
    #floorSVG .unit.active { fill: rgba(255, 215, 0, .6); }

    /* =====================================
       CHROME
    ===================================== */
    /* =====================================
       HEADER - the black band at the top was this element.
       style.css gives it  background:#222 + padding:18px 30px,
       which paints a solid strip across the page and pushes the
       plan down. Killed here: transparent, zero padding, and it
       collapses to nothing when the legend is empty.
    ===================================== */
    header {
      position: fixed;
      top: 0; left: 0;
      width: 100%;
      z-index: 120;
      padding: 0 !important;
      margin: 0 !important;
      background: transparent !important;
      border: 0 !important;
      box-shadow: none !important;
      pointer-events: none;
    }

    header h1 { display: none !important; }

    /* no legend items -> no header box at all */
    header:has(#legend:empty) { display: none; }
    #legend:empty { display: none; }

    #legend {
      display: flex;
      gap: 14px;
      font-size: 12px;
      color: #fff;
      flex-wrap: wrap;
    }

    .back-btn {
      position: fixed;
      top: 20px; left: 20px;
      padding: 10px 20px;
      background: #fff;
      color: #000;
      text-decoration: none;
      border-radius: 10px;
      z-index: 130;
      font-weight: 600;
    }

    #timer {
      position: fixed;
      top: 20px; right: 20px;
      z-index: 130;
      padding: 6px 12px;
      border-radius: 8px;
      background: rgba(0, 0, 0, .6);
      color: #fff;
      font-size: 13px;
    }

    #tooltip {
      z-index: 999999 !important;
      pointer-events: none !important;
      position: fixed;
      z-index: 140;
      padding: 8px 12px;
      border-radius: 8px;
      background: rgba(0, 0, 0, .85);
      color: #fff;
      font-size: 12px;
      line-height: 1.45;
      pointer-events: none;
      opacity: 0;
      transition: opacity .15s ease;
      max-width: 60vw;
    }

    #tooltip.show { opacity: 1; }
    #tooltip {
      z-index: 999999 !important;
      pointer-events: none !important;
      min-width: 190px;
      padding: 12px 14px;
      border: 1px solid rgba(255,255,255,.16);
      border-radius: 12px;
      background: rgba(15,15,15,.94);
      box-shadow: 0 12px 35px rgba(0,0,0,.35);
      backdrop-filter: blur(10px);
    }
    #tooltip .unit-tip-title {
      font-size: 14px; font-weight: 800; margin-bottom: 8px;
      padding-bottom: 7px; border-bottom: 1px solid rgba(255,255,255,.14);
    }
    #tooltip .unit-tip-row { display:flex; justify-content:space-between; gap:20px; margin:5px 0; font-size:12px; }
    #tooltip .unit-tip-row span { opacity:.68; }
    #tooltip .unit-tip-row b { font-weight:700; text-align:right; }
    #tooltip .unit-tip-status { color:#FFD700; }


    /* =====================================
       MOBILE LANDSCAPE
    ===================================== */
    @media (orientation: landscape) and (max-height: 500px) {
      #floorNav, .floor-nav, #floorSelector, .floor-switcher {
        position: fixed !important;
        top: 50% !important;
        right: 6px !important;
        left: auto !important;
        bottom: auto !important;
        transform: translateY(-50%) !important;
        z-index: 200 !important;
      }

      .back-btn { top: 8px; left: 8px; padding: 7px 12px; font-size: 11px; }
      #timer { top: 8px; right: 8px; padding: 5px 10px; font-size: 12px; }
      #tooltip {
      z-index: 999999 !important;
      pointer-events: none !important; padding: 7px 10px; font-size: 11px; max-width: 55vw; }
      #floorSVG .unit { stroke-width: 5; }
    }

    /* =====================================
       MOBILE PORTRAIT - ROTATED / VERTICAL VIEW
       The plan is 16:9 (landscape). On a portrait phone we rotate the
       whole stage 90deg so the long side of the plan runs down the
       screen and fills it. Because the image AND the SVG are both
       inside .floor-stage, one rotation moves them together - the
       overlay stays pixel-locked to the drawing.
       Cover math is swapped: stage width is measured against the
       viewport HEIGHT and stage height against the viewport WIDTH,
       since the axes trade places after the rotation.
    ===================================== */
    @media (max-width: 768px) and (orientation: portrait) {
      .floor-stage {
        width:  max(calc(var(--vh, 1vh) * 100), calc(100vw * (var(--plan-w) / var(--plan-h))));
        height: max(100vw, calc(var(--vh, 1vh) * 100 * (var(--plan-h) / var(--plan-w))));
        transform: translate(-50%, -50%) rotate(90deg);
        transform-origin: center center;
      }

      #floorNav, .floor-nav, #floorSelector, .floor-switcher {
        position: fixed !important;
        top: auto !important;
        bottom: 20px !important;
        left: 50% !important;
        right: auto !important;
        transform: translateX(-50%) !important;
        z-index: 200 !important;
      }

      .back-btn { top: 8px; left: 8px; padding: 7px 13px; font-size: 12px; }
      #timer { top: 8px; right: 8px; font-size: 12px; }
      #tooltip {
      z-index: 999999 !important;
      pointer-events: none !important; font-size: 11px; max-width: 80vw; }
      #floorSVG .unit { stroke-width: 4; }
    }

    /* =====================================
       PLAN MODAL - opens on unit click
    ===================================== */
    #planModal {
      position: fixed;
      inset: 0;
      z-index: 10000;
      display: none;
      background: rgba(8, 8, 10, .92);
      backdrop-filter: blur(6px);
      -webkit-backdrop-filter: blur(6px);
    }

    #planModal.open { display: flex; flex-direction: column; }

    .planModal-bar {
      flex: 0 0 auto;
      display: flex;
      align-items: center;
      gap: 14px;
      padding: 14px 18px;
      color: #fff;
    }

    .planModal-title {
      font-size: 16px;
      font-weight: 700;
      letter-spacing: .2px;
      white-space: nowrap;
    }

    .planModal-meta {
      display: flex;
      gap: 8px;
      flex-wrap: wrap;
      font-size: 12px;
    }

    .planModal-meta span {
      padding: 5px 10px;
      border-radius: 999px;
      background: rgba(255, 255, 255, .1);
      border: 1px solid rgba(255, 255, 255, .14);
      white-space: nowrap;
    }

    #planModalClose {
      margin-left: auto;
      width: 40px;
      height: 40px;
      flex: 0 0 auto;
      border: 0;
      border-radius: 50%;
      background: #fff;
      color: #111;
      font-size: 20px;
      line-height: 1;
      cursor: pointer;
    }

    .planModal-body {
      flex: 1 1 auto;
      min-height: 0;
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 0 18px 18px;
    }

    #planModalImg {
      max-width: 100%;
      max-height: 100%;
      width: auto;
      height: auto;
      object-fit: contain;
      border-radius: 10px;
      background: #fff;
      box-shadow: 0 20px 60px rgba(0, 0, 0, .55);
    }

    @media (max-width: 768px) {
      .planModal-bar { padding: 10px 12px; gap: 10px; flex-wrap: wrap; }
      .planModal-title { font-size: 14px; }
      .planModal-meta { font-size: 11px; }
      .planModal-meta span { padding: 4px 8px; }
      #planModalClose { width: 34px; height: 34px; font-size: 17px; }
      .planModal-body { padding: 0 10px 10px; }
    }

    /* =====================================
       PLAN MODAL - DESKTOP = HORIZONTAL
       The unit plan is a portrait drawing (1388 x 2876). On desktop
       it is rotated 90deg so it reads horizontally and fills ~80% of
       the screen. max-width/max-height are SWAPPED on purpose: after
       the rotation the element's width runs down the screen and its
       height runs across it.
       Mobile keeps it vertical (rule: horizontal desktop / vertical mobile).
    ===================================== */
    @media (min-width: 769px) {
      #planModalImg {
        max-width: 80vh;    /* becomes screen HEIGHT after rotate */
        max-height: 80vw;   /* becomes screen WIDTH  after rotate */
        transform: rotate(90deg);
      }
    }

    /* =====================================
       ROOM BUTTONS
    ===================================== */
    .planModal-rooms {
      flex: 0 0 auto;
      display: flex;
      gap: 8px;
      flex-wrap: wrap;
      justify-content: center;
      padding: 0 18px 14px;
    }

    .roomBtn {
      display: inline-flex;
      flex-direction: column;
      align-items: flex-start;
      gap: 2px;

      padding: 8px 14px;
      border: 1px solid rgba(255, 255, 255, .18);
      border-radius: 10px;
      background: rgba(255, 255, 255, .07);
      color: #fff;

      font-family: inherit;
      font-size: 13px;
      font-weight: 700;
      line-height: 1.2;

      cursor: pointer;
      transition: background .18s ease, border-color .18s ease, transform .15s ease;
    }

    .roomBtn small {
      font-size: 10px;
      font-weight: 500;
      opacity: .7;
    }

    .roomBtn:hover {
      background: rgba(255, 215, 0, .18);
      border-color: #FFD700;
      transform: translateY(-1px);
    }

    .roomBtn.active {
      background: #FFD700;
      border-color: #FFD700;
      color: #111;
    }

    .roomBtn.active small { opacity: .75; }

    @media (max-width: 768px) {
      .planModal-rooms { gap: 6px; padding: 0 10px 10px; }
      .roomBtn { padding: 6px 10px; font-size: 11px; border-radius: 8px; }
      .roomBtn small { font-size: 9px; }
    }

    /* popups */
    #popupContainer .card,
    #popupContainer .overlay > div,
    .card {
      width: min(420px, 92vw);
      max-height: 88vh;
      overflow-y: auto;
      padding: 16px 18px;
    }
  </style>
</head>

    /* Robust unit hover tooltip */
    (function () {
      const svg = document.getElementById("floorSVG");
      const tip = document.getElementById("tooltip");
      if (!svg || !tip) return;

      function esc(value) {
        return String(value ?? "").replace(/[&<>"]/g, c => ({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;"}[c]));
      }

      function getUnit(target) {
        return target && target.closest ? target.closest("path.unit, polygon.unit, rect.unit, g.unit") : null;
      }

      function position(e) {
        const pad = 18;
        let x = e.clientX + pad, y = e.clientY + pad;
        const r = tip.getBoundingClientRect();
        if (x + r.width > window.innerWidth - 10) x = e.clientX - r.width - pad;
        if (y + r.height > window.innerHeight - 10) y = e.clientY - r.height - pad;
        tip.style.left = Math.max(8, x) + "px";
        tip.style.top = Math.max(8, y) + "px";
      }

      function show(e, unit) {
        const number = unit.dataset.unit || unit.id || "—";
        const d = (window.unitDetails && (window.unitDetails[number] || window.unitDetails[unit.id])) || {};
        const status = unit.dataset.status || d.status || "Available";
        tip.innerHTML =
          '<div class="unit-tip-title">Unit ' + esc(number) + '</div>' +
          '<div class="unit-tip-row"><span>Length</span><b>' + esc(d.length || "—") + '</b></div>' +
          '<div class="unit-tip-row"><span>Width</span><b>' + esc(d.width || d.breadth || "—") + '</b></div>' +
          '<div class="unit-tip-row"><span>Area</span><b>' + esc(d.totalArea || d.area || "—") + '</b></div>' +
          '<div class="unit-tip-row"><span>Status</span><b class="unit-tip-status">' + esc(status) + '</b></div>';
        tip.classList.add("show");
        tip.style.display = "block";
        tip.style.pointerEvents = "none";
        position(e);
      }

      svg.addEventListener("pointerover", e => {
        const unit = getUnit(e.target);
        if (unit) show(e, unit);
      }, true);

      svg.addEventListener("pointermove", e => {
        const unit = getUnit(e.target);
        if (unit) position(e);
      }, true);

      svg.addEventListener("pointerout", e => {
        const from = getUnit(e.target);
        const to = getUnit(e.relatedTarget);
        if (from && from !== to) tip.classList.remove("show");
      }, true);

      // Make sure SVG units always receive pointer events.
      svg.querySelectorAll(".unit").forEach(el => {
        el.style.pointerEvents = "all";
        el.style.cursor = "pointer";
      });
    })();
  </script>

<script type="module">
import { createClient } from 'https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2.111.0/+esm';
const SUPABASE_URL = 'https://jpiudwptxzzgtgxtbnsa.supabase.co';
const SUPABASE_KEY = 'sb_publishable_fJcnKZol-Xh_mSD9CORA5A_epWa097V';
const supabase = createClient(SUPABASE_URL, SUPABASE_KEY);

const lock = document.getElementById('eldeco-lock');
const form = document.getElementById('eldecoVisitorForm');
const err = document.getElementById('evErr');
const evName = document.getElementById('evName');
const evMobile = document.getElementById('evMobile');
const evEmail = document.getElementById('evEmail');
const evCity = document.getElementById('evCity');
const evSubmit = document.getElementById('evSubmit');

form.addEventListener('submit', async (e) => {
  e.preventDefault();
  err.textContent = '';
  const name = evName.value.trim();
  const mobile = evMobile.value.replace(/\D/g, '');
  const email = evEmail.value.trim() || null;
  const city = evCity.value.trim() || null;
  if (!name) { err.textContent = 'Please enter your name.'; return; }
  if (mobile.length < 10 || mobile.length > 15) { err.textContent = 'Enter a valid mobile number.'; return; }
  evSubmit.disabled = true;
  evSubmit.textContent = 'Entering...';
  const { error } = await supabase.from('visitors').insert({ name, mobile, email, city, source: 'eldeco-ipx' });
  if (error) {
    console.error('Visitor registration failed:', error);
    err.textContent = error.message || 'Unable to register. Please try again.';
    evSubmit.disabled = false;
    evSubmit.textContent = 'Enter Website';
    return;
  }
  lock.classList.add('hidden');
  document.body.classList.add('eldeco-unlocked');
});

async function applyInventory() {
  const [unitsResult, statusesResult] = await Promise.all([
    supabase.from('units').select('unit_number,svg_id,status_id,buyer_name,buyer_number'),
    supabase.from('status_categories').select('id,name,color').eq('active', true).order('sort_order')
  ]);
  if (unitsResult.error || statusesResult.error) {
    console.warn('Eldeco inventory load failed', unitsResult.error || statusesResult.error);
    return;
  }
  const units = unitsResult.data || [];
  const statuses = statusesResult.data || [];
  const statusMap = new Map(statuses.map(s => [s.id, s]));
  document.querySelectorAll('#floorSVG .unit').forEach(el => {
    const unit = units.find(u => u.svg_id === el.id || u.unit_number === el.dataset.unit);
    const status = unit ? statusMap.get(unit.status_id) : null;
    el.classList.add('unit-live');
    if (status) {
      el.dataset.status = status.name;
      el.style.fill = status.color;
      el.style.fillOpacity = '.45';
      el.style.stroke = status.color;
      el.style.strokeOpacity = '.95';
      el.dataset.buyer = unit.buyer_name || '';
      el.dataset.buyerNumber = unit.buyer_number || '';
    }
  });
}

/* Bright hover outline while preserving each unit's live status color. */
document.querySelectorAll('#floorSVG .unit').forEach(function (el) {
  el.addEventListener('mouseenter', function () {
    el.dataset.originalStrokeWidth = el.style.strokeWidth || '';
    el.style.strokeWidth = '7';
    el.style.filter = 'brightness(1.2) drop-shadow(0 0 7px rgba(255,215,0,.95)) drop-shadow(0 0 18px rgba(255,215,0,.65))';
  });
  el.addEventListener('mouseleave', function () {
    el.style.strokeWidth = el.dataset.originalStrokeWidth || '';
    el.style.filter = '';
  });
});

applyInventory();
supabase.channel('eldeco-live')
  .on('postgres_changes', { event: '*', schema: 'public', table: 'units' }, applyInventory)
  .on('postgres_changes', { event: '*', schema: 'public', table: 'status_categories' }, applyInventory)
  .subscribe();
</script>
