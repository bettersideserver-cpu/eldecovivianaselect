<!DOCTYPE html>
<html lang="en">

<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Eldeco Viviana Select</title>
  <link rel="stylesheet" href="style.css">

  <style>
    /* =====================================
       RESET
    ===================================== */
    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
    }

    html,
    body {
      width: 100%;
      height: 100%;
      overflow: hidden;
      background: #111;
      font-family: Arial, Helvetica, sans-serif;
    }

    /* =====================================
       CONTAINER - full viewport, zero padding
    ===================================== */
    .floor-container {
      position: fixed;
      inset: 0;
      width: 100vw;
      height: 100vh;
      overflow: hidden;
    }

    /* =====================================
       STAGE - COVER MATH
       The stage keeps the SVG ratio (3840 / 2160) and grows with
       max() until it covers the viewport on BOTH axes, then it is
       centred. That is exactly what object-fit: cover does to the
       image, so image and SVG land on the same pixels at any size.
       Want the full plan visible instead? swap max() -> min().
    ===================================== */
    :root {
      --plan-w: 3840;
      --plan-h: 2160;
    }

    .floor-stage {
      position: absolute;
      top: 50%;
      left: 50%;
      transform: translate(-50%, -50%);
      width: max(100vw, calc(var(--vh, 1vh) * 100 * (var(--plan-w) / var(--plan-h))));
      height: max(calc(var(--vh, 1vh) * 100), calc(100vw * (var(--plan-h) / var(--plan-w))));
    }

    /* =====================================
       IMAGE + SVG - same box, same pixels
    ===================================== */
    #floorImage,
    #floorSVG {
      position: absolute;
      inset: 0;
      width: 100%;
      height: 100%;
      display: block;
    }

    #floorImage {
      object-fit: fill;
      /* stage already matches image ratio */
      user-select: none;
      pointer-events: none;
    }

    #floorSVG {
      z-index: 10;
    }

    /* =====================================
       CLICKABLE UNITS
    ===================================== */
    #floorSVG .unit {
      fill: rgba(255, 255, 255, 0.001);
      stroke: transparent;
      stroke-width: 3;
      cursor: pointer;
      pointer-events: all;
      transition: fill .25s ease, stroke .25s ease, filter .25s ease;
    }

    #floorSVG .unit:hover {
      fill: rgba(255, 215, 0, .35);
      stroke: #FFD700;
      filter: drop-shadow(0 0 8px #FFD700) drop-shadow(0 0 20px #FFD700) !important;
    }

    #floorSVG .unit:active,
    #floorSVG .unit.active {
      fill: rgba(255, 215, 0, .6);
    }

    /* =====================================
       CHROME
    ===================================== */
    /* =====================================
       HEADER - the black band at the top was this element.
       style.css gives it  background:#222 + padding:18px 30px,
       which paints a solid strip across the page and pushes the
       plan down. Killed here: transparent, zero padding, and it
       collapses to nothing when the legend is empty.
    ===================================== */
    header {
      position: fixed;
      top: 0;
      left: 0;
      width: 100%;
      z-index: 120;
      padding: 0 !important;
      margin: 0 !important;
      background: transparent !important;
      border: 0 !important;
      box-shadow: none !important;
      pointer-events: none;
    }

    header h1 {
      display: none !important;
    }

    /* no legend items -> no header box at all */
    header:has(#legend:empty) {
      display: none;
    }

    #legend:empty {
      display: none;
    }

    #legend {
      display: flex;
      gap: 14px;
      font-size: 12px;
      color: #fff;
      flex-wrap: wrap;
    }

    .back-btn {
      position: fixed;
      top: 20px;
      left: 20px;
      padding: 10px 20px;
      background: #fff;
      color: #000;
      text-decoration: none;
      border-radius: 10px;
      z-index: 130;
      font-weight: 600;
    }

    #timer {
      position: fixed;
      top: 20px;
      right: 20px;
      z-index: 130;
      padding: 6px 12px;
      border-radius: 8px;
      background: rgba(0, 0, 0, .6);
      color: #fff;
      font-size: 13px;
    }

    #tooltip {
      z-index: 999999 !important;
      pointer-events: none !important;
      position: fixed;
      z-index: 140;
      padding: 8px 12px;
      border-radius: 8px;
      background: rgba(0, 0, 0, .85);
      color: #fff;
      font-size: 12px;
      line-height: 1.45;
      pointer-events: none;
      opacity: 0;
      transition: opacity .15s ease;
      max-width: 60vw;
    }

    #tooltip.show {
      opacity: 1;
    }

    #tooltip {
      z-index: 999999 !important;
      pointer-events: none !important;
      min-width: 190px;
      padding: 12px 14px;
      border: 1px solid rgba(255, 255, 255, .16);
      border-radius: 12px;
      background: rgba(15, 15, 15, .94);
      box-shadow: 0 12px 35px rgba(0, 0, 0, .35);
      backdrop-filter: blur(10px);
    }

    #tooltip .unit-tip-title {
      font-size: 14px;
      font-weight: 800;
      margin-bottom: 8px;
      padding-bottom: 7px;
      border-bottom: 1px solid rgba(255, 255, 255, .14);
    }

    #tooltip .unit-tip-row {
      display: flex;
      justify-content: space-between;
      gap: 20px;
      margin: 5px 0;
      font-size: 12px;
    }

    #tooltip .unit-tip-row span {
      opacity: .68;
    }

    #tooltip .unit-tip-row b {
      font-weight: 700;
      text-align: right;
    }

    #tooltip .unit-tip-status {
      color: #FFD700;
    }


    /* =====================================
       MOBILE LANDSCAPE
    ===================================== */
    @media (orientation: landscape) and (max-height: 500px) {

      #floorNav,
      .floor-nav,
      #floorSelector,
      .floor-switcher {
        position: fixed !important;
        top: 50% !important;
        right: 6px !important;
        left: auto !important;
        bottom: auto !important;
        transform: translateY(-50%) !important;
        z-index: 200 !important;
      }

      .back-btn {
        top: 8px;
        left: 8px;
        padding: 7px 12px;
        font-size: 11px;
      }

      #timer {
        top: 8px;
        right: 8px;
        padding: 5px 10px;
        font-size: 12px;
      }

      #tooltip {
        z-index: 999999 !important;
        pointer-events: none !important;
        padding: 7px 10px;
        font-size: 11px;
        max-width: 55vw;
      }

      #floorSVG .unit {
        stroke-width: 5;
      }
    }

    /* =====================================
       MOBILE PORTRAIT - ROTATED / VERTICAL VIEW
       The plan is 16:9 (landscape). On a portrait phone we rotate the
       whole stage 90deg so the long side of the plan runs down the
       screen and fills it. Because the image AND the SVG are both
       inside .floor-stage, one rotation moves them together - the
       overlay stays pixel-locked to the drawing.
       Cover math is swapped: stage width is measured against the
       viewport HEIGHT and stage height against the viewport WIDTH,
       since the axes trade places after the rotation.
    ===================================== */
    @media (max-width: 768px) and (orientation: portrait) {
      .floor-stage {
        width: max(calc(var(--vh, 1vh) * 100), calc(100vw * (var(--plan-w) / var(--plan-h))));
        height: max(100vw, calc(var(--vh, 1vh) * 100 * (var(--plan-h) / var(--plan-w))));
        transform: translate(-50%, -50%) rotate(90deg);
        transform-origin: center center;
      }

      #floorNav,
      .floor-nav,
      #floorSelector,
      .floor-switcher {
        position: fixed !important;
        top: auto !important;
        bottom: 20px !important;
        left: 50% !important;
        right: auto !important;
        transform: translateX(-50%) !important;
        z-index: 200 !important;
      }

      .back-btn {
        top: 8px;
        left: 8px;
        padding: 7px 13px;
        font-size: 12px;
      }

      #timer {
        top: 8px;
        right: 8px;
        font-size: 12px;
      }

      #tooltip {
        z-index: 999999 !important;
        pointer-events: none !important;
        font-size: 11px;
        max-width: 80vw;
      }

      #floorSVG .unit {
        stroke-width: 4;
      }
    }

    /* =====================================
       PLAN MODAL - opens on unit click
    ===================================== */
    #planModal {
      position: fixed;
      inset: 0;
      z-index: 10000;
      display: none;
      background: rgba(8, 8, 10, .92);
      backdrop-filter: blur(6px);
      -webkit-backdrop-filter: blur(6px);
    }

    #planModal.open {
      display: flex;
      flex-direction: column;
    }

    .planModal-bar {
      flex: 0 0 auto;
      display: flex;
      align-items: center;
      gap: 14px;
      padding: 14px 18px;
      color: #fff;
    }

    .planModal-title {
      font-size: 16px;
      font-weight: 700;
      letter-spacing: .2px;
      white-space: nowrap;
    }

    .planModal-meta {
      display: flex;
      gap: 8px;
      flex-wrap: wrap;
      font-size: 12px;
    }

    .planModal-meta span {
      padding: 5px 10px;
      border-radius: 999px;
      background: rgba(255, 255, 255, .1);
      border: 1px solid rgba(255, 255, 255, .14);
      white-space: nowrap;
    }

    #planModalClose {
      margin-left: auto;
      width: 40px;
      height: 40px;
      flex: 0 0 auto;
      border: 0;
      border-radius: 50%;
      background: #fff;
      color: #111;
      font-size: 20px;
      line-height: 1;
      cursor: pointer;
    }

    .planModal-body {
      flex: 1 1 auto;
      min-height: 0;
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 0 18px 18px;
    }

    #planModalImg {
      max-width: 100%;
      max-height: 100%;
      width: auto;
      height: auto;
      object-fit: contain;
      border-radius: 10px;
      background: #fff;
      box-shadow: 0 20px 60px rgba(0, 0, 0, .55);
    }

    @media (max-width: 768px) {
      .planModal-bar {
        padding: 10px 12px;
        gap: 10px;
        flex-wrap: wrap;
      }

      .planModal-title {
        font-size: 14px;
      }

      .planModal-meta {
        font-size: 11px;
      }

      .planModal-meta span {
        padding: 4px 8px;
      }

      #planModalClose {
        width: 34px;
        height: 34px;
        font-size: 17px;
      }

      .planModal-body {
        padding: 0 10px 10px;
      }
    }

    /* =====================================
       PLAN MODAL - DESKTOP = HORIZONTAL
       The unit plan is a portrait drawing (1388 x 2876). On desktop
       it is rotated 90deg so it reads horizontally and fills ~80% of
       the screen. max-width/max-height are SWAPPED on purpose: after
       the rotation the element's width runs down the screen and its
       height runs across it.
       Mobile keeps it vertical (rule: horizontal desktop / vertical mobile).
    ===================================== */
    @media (min-width: 769px) {
      #planModalImg {
        max-width: 80vh;
        /* becomes screen HEIGHT after rotate */
        max-height: 80vw;
        /* becomes screen WIDTH  after rotate */
        transform: rotate(90deg);
      }
    }

    /* =====================================
       ROOM BUTTONS
    ===================================== */
    .planModal-rooms {
      flex: 0 0 auto;
      display: flex;
      gap: 8px;
      flex-wrap: wrap;
      justify-content: center;
      padding: 0 18px 14px;
    }

    .roomBtn {
      display: inline-flex;
      flex-direction: column;
      align-items: flex-start;
      gap: 2px;

      padding: 8px 14px;
      border: 1px solid rgba(255, 255, 255, .18);
      border-radius: 10px;
      background: rgba(255, 255, 255, .07);
      color: #fff;

      font-family: inherit;
      font-size: 13px;
      font-weight: 700;
      line-height: 1.2;

      cursor: pointer;
      transition: background .18s ease, border-color .18s ease, transform .15s ease;
    }

    .roomBtn small {
      font-size: 10px;
      font-weight: 500;
      opacity: .7;
    }

    .roomBtn:hover {
      background: rgba(255, 215, 0, .18);
      border-color: #FFD700;
      transform: translateY(-1px);
    }

    .roomBtn.active {
      background: #FFD700;
      border-color: #FFD700;
      color: #111;
    }

    .roomBtn.active small {
      opacity: .75;
    }

    @media (max-width: 768px) {
      .planModal-rooms {
        gap: 6px;
        padding: 0 10px 10px;
      }

      .roomBtn {
        padding: 6px 10px;
        font-size: 11px;
        border-radius: 8px;
      }

      .roomBtn small {
        font-size: 9px;
      }
    }

    /* popups */
    #popupContainer .card,
    #popupContainer .overlay>div,
    .card {
      width: min(420px, 92vw);
      max-height: 88vh;
      overflow-y: auto;
      padding: 16px 18px;
    }

    /* Request to Hold */
    #requestHoldBtn {
      flex: 0 0 auto;
      padding: 10px 16px;
      border: 0;
      border-radius: 10px;
      background: #FFD700;
      color: #111;
      font: 800 13px Arial, sans-serif;
      cursor: pointer;
      box-shadow: 0 4px 16px rgba(0, 0, 0, .22);
    }

    #requestHoldBtn:hover {
      transform: translateY(-1px);
    }

    #requestHoldBtn:disabled {
      opacity: .55;
      cursor: not-allowed;
      transform: none;
    }

    #holdConfirmOverlay {
      position: fixed;
      inset: 0;
      z-index: 20000;
      display: none;
      align-items: center;
      justify-content: center;
      background: rgba(0, 0, 0, .58);
      backdrop-filter: blur(8px);
      -webkit-backdrop-filter: blur(8px);
    }

    #holdConfirmOverlay.open {
      display: flex;
    }

    .hold-confirm-card {
      width: min(430px, 90vw);
      background: #fff;
      color: #111;
      border-radius: 16px;
      padding: 24px;
      box-shadow: 0 25px 80px rgba(0, 0, 0, .35);
      text-align: center;
      font-family: Arial, sans-serif;
    }

    .hold-confirm-card h3 {
      margin: 0 0 8px;
      font-size: 20px;
    }

    .hold-confirm-card p {
      margin: 0 0 20px;
      color: #666;
      line-height: 1.5;
    }

    .hold-confirm-actions {
      display: flex;
      gap: 10px;
      justify-content: center;
    }

    .hold-confirm-actions button {
      min-width: 100px;
      padding: 11px 18px;
      border-radius: 9px;
      border: 1px solid #ddd;
      font-weight: 700;
      cursor: pointer;
    }

    #holdYesBtn {
      background: #111;
      color: #fff;
      border-color: #111;
    }

    #holdNoBtn {
      background: #fff;
      color: #111;
    }

    #holdConfirmMsg {
      min-height: 18px;
      margin-top: 12px;
      font-size: 12px;
      color: #b42318;
    }

    @media(max-width:768px) {
      #requestHoldBtn {
        padding: 8px 11px;
        font-size: 11px;
      }

      .hold-confirm-card {
        padding: 20px;
      }
    }

    /* Availability toggle */
    #availabilityToggle {
      position: fixed;
      top: 20px;
      left: 140px;
      z-index: 130;
      padding: 10px 16px;
      border: 0;
      border-radius: 10px;
      background: #fff;
      color: #111;
      font: 700 13px Arial, sans-serif;
      cursor: pointer;
      box-shadow: 0 4px 18px rgba(0, 0, 0, .22)
    }

    #availabilityToggle.off {
      background: rgba(0, 0, 0, .72);
      color: #fff
    }

    #legend.availability-hidden {
      display: none !important
    }

    @media(max-width:768px) {
      #availabilityToggle {
        top: 8px;
        left: 105px;
        padding: 7px 11px;
        font-size: 11px
      }
    }
  </style>
</head>

  <script>
    /* Robust unit hover tooltip */
    (function () {
      const svg = document.getElementById("floorSVG");
      const tip = document.getElementById("tooltip");
      if (!svg || !tip) return;

      function esc(value) {
        return String(value ?? "").replace(/[&<>"]/g, c => ({ "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;" }[c]));
      }

      function getUnit(target) {
        return target && target.closest ? target.closest("path.unit, polygon.unit, rect.unit, g.unit") : null;
      }

      function position(e) {
        const pad = 18;
        let x = e.clientX + pad, y = e.clientY + pad;
        const r = tip.getBoundingClientRect();
        if (x + r.width > window.innerWidth - 10) x = e.clientX - r.width - pad;
        if (y + r.height > window.innerHeight - 10) y = e.clientY - r.height - pad;
        tip.style.left = Math.max(8, x) + "px";
        tip.style.top = Math.max(8, y) + "px";
      }

      function show(e, unit) {
        const number = unit.dataset.unit || unit.id || "—";
        const d = (window.unitDetails && (window.unitDetails[number] || window.unitDetails[unit.id])) || {};
        const status = unit.dataset.status || d.status || "Available";
        const availabilityOn = document.getElementById("availabilityToggle")?.getAttribute("aria-pressed") !== "false";
        tip.innerHTML =
          '<div class="unit-tip-title">Unit ' + esc(number) + '</div>' +
          '<div class="unit-tip-row"><span>Length</span><b>' + esc(d.length || "—") + '</b></div>' +
          '<div class="unit-tip-row"><span>Width</span><b>' + esc(d.width || d.breadth || "—") + '</b></div>' +
          '<div class="unit-tip-row"><span>Area</span><b>' + esc(d.totalArea || d.area || "—") + '</b></div>' +
          (availabilityOn ? '<div class="unit-tip-row"><span>Status</span><b class="unit-tip-status">' + esc(status) + '</b></div>' : '');
        tip.classList.add("show");
        tip.style.display = "block";
        tip.style.pointerEvents = "none";
        position(e);
      }

      svg.addEventListener("pointerover", e => {
        const unit = getUnit(e.target);
        if (unit) show(e, unit);
      }, true);

      svg.addEventListener("pointermove", e => {
        const unit = getUnit(e.target);
        if (unit) position(e);
      }, true);

      svg.addEventListener("pointerout", e => {
        const from = getUnit(e.target);
        const to = getUnit(e.relatedTarget);
        if (from && from !== to) tip.classList.remove("show");
      }, true);

      // Make sure SVG units always receive pointer events.
      svg.querySelectorAll(".unit").forEach(el => {
        el.style.pointerEvents = "all";
        el.style.cursor = "pointer";
      });
    })();
  </script>

  <script>
    /* =====================================
       CLICK A UNIT -> SHOW ITS FLOOR PLAN
    ===================================== */
    (function () {
      var svg = document.getElementById("floorSVG");
      var modal = document.getElementById("planModal");
      var img = document.getElementById("planModalImg");
      var title = document.getElementById("planModalTitle");
      var meta = document.getElementById("planModalMeta");
      var tip = document.getElementById("tooltip");
      var requestHoldBtn = document.getElementById("requestHoldBtn");
      var holdOverlay = document.getElementById("holdConfirmOverlay");
      var holdText = document.getElementById("holdConfirmText");
      var holdYesBtn = document.getElementById("holdYesBtn");
      var holdNoBtn = document.getElementById("holdNoBtn");
      var holdMsg = document.getElementById("holdConfirmMsg");
      var selectedDetails = null;

      function planFor(details) {
        var size = String(details.totalArea || "").split(" ")[0].replace(/,/g, "");
        return window.planImages[size] || window.planImages["default"];
      }

      function open(details) {
        selectedDetails = details;
        title.textContent = details.unit || "Plot";
        meta.innerHTML =
          "<span>Total Area: " + details.totalArea + "</span>" +
          "<span>Length: " + details.length + "</span>" +
          "<span>Breadth: " + details.breadth + "</span>";

        img.src = planFor(details);
        img.alt = (details.unit || "Unit") + " floor plan";
        requestHoldBtn.disabled = false;
        requestHoldBtn.textContent = "Request to Hold";

        modal.classList.add("open");
        modal.setAttribute("aria-hidden", "false");
        if (typeof window.clearRoomSelection === "function") window.clearRoomSelection();
        if (tip) tip.classList.remove("show");
      }

      function close() {
        closeHoldConfirm();
        modal.classList.remove("open");
        modal.setAttribute("aria-hidden", "true");
        img.src = "";
      }

      function closeHoldConfirm() {
        holdOverlay.classList.remove("open");
        holdOverlay.setAttribute("aria-hidden", "true");
        holdMsg.textContent = "";
        holdYesBtn.disabled = false;
        holdNoBtn.disabled = false;
      }

      requestHoldBtn.addEventListener("click", function () {
        if (!selectedDetails) return;
        holdText.textContent = "Do you want to request " + (selectedDetails.unit || "this property") + " to be held?";
        holdMsg.textContent = "";
        holdOverlay.classList.add("open");
        holdOverlay.setAttribute("aria-hidden", "false");
      });

      holdNoBtn.addEventListener("click", closeHoldConfirm);
      holdOverlay.addEventListener("click", function (e) { if (e.target === holdOverlay) closeHoldConfirm(); });

      holdYesBtn.addEventListener("click", async function () {
        if (!selectedDetails) return;
        holdYesBtn.disabled = true; holdNoBtn.disabled = true;
        holdYesBtn.textContent = "Submitting..."; holdMsg.textContent = "";
        try {
          var visitor = {};
          try { visitor = JSON.parse(sessionStorage.getItem("eldecoVisitor") || "{}"); } catch (_) { }
          var unitNumber = String(selectedDetails.unit || "").replace(/^Plot\s*/i, "").trim();
          var payload = {
            unit_number: unitNumber,
            property_name: selectedDetails.unit || ("Plot " + unitNumber),
            visitor_name: visitor.name || null,
            visitor_mobile: visitor.mobile || null,
            visitor_email: visitor.email || null,
            visitor_city: visitor.city || null,
            status: "pending"
          };
          var result = await supabase.from("hold_requests").insert(payload);
          if (result.error) throw result.error;
          holdMsg.style.color = "#18794e"; holdMsg.textContent = "Request sent to admin successfully.";
          holdYesBtn.textContent = "Sent";
          setTimeout(closeHoldConfirm, 1200);
        } catch (err) {
          console.error("Hold request failed:", err);
          holdMsg.style.color = "#b42318";
          holdMsg.textContent = err.message || "Unable to send request. Please try again.";
          holdYesBtn.disabled = false; holdNoBtn.disabled = false; holdYesBtn.textContent = "Yes";
        }
      });

      svg.addEventListener("click", function (e) {
        var unit = e.target.closest(".unit");
        if (!unit) return;

        var unitNumber = unit.getAttribute("data-unit") || unit.id;
        var details = window.unitDetails[unitNumber] || window.unitDetails[unit.id];
        if (!details) return;

        open(details);
      });

      document.getElementById("planModalClose").addEventListener("click", close);

      /* backdrop click closes, image click does not */
      modal.addEventListener("click", function (e) {
        if (e.target === modal || e.target.classList.contains("planModal-body")) close();
      });

      document.addEventListener("keydown", function (e) {
        if (e.key === "Escape" && modal.classList.contains("open")) close();
      });
    })();
  </script>

  <script>
    /* =====================================
       BUILD THE ROOM BUTTONS
       Selecting one marks it active and fires a hook so the next
       behaviour (highlight / zoom / detail card) can hang off it.
    ===================================== */
    (function () {
      var wrap = document.getElementById("planModalRooms");

      window.planRooms.forEach(function (room) {
        var btn = document.createElement("button");
        btn.type = "button";
        btn.className = "roomBtn";
        btn.dataset.room = room.key;
        btn.innerHTML = room.label + "<small>" + room.ft + "</small>";
        btn.title = room.mm + " mm";

        btn.addEventListener("click", function () {
          var was = btn.classList.contains("active");

          wrap.querySelectorAll(".roomBtn.active")
            .forEach(function (b) { b.classList.remove("active"); });

          if (!was) btn.classList.add("active");

          if (typeof window.onRoomSelect === "function") {
            window.onRoomSelect(was ? null : room);
          }
        });

        wrap.appendChild(btn);
      });

      /* clear the selection whenever the modal is reopened */
      window.clearRoomSelection = function () {
        wrap.querySelectorAll(".roomBtn.active")
          .forEach(function (b) { b.classList.remove("active"); });
      };
    })();
  </script>

  <script>
    /* =====================================
       CONNECT ROOM BUTTONS -> 360 TOUR
       Clicking a room button in the plan modal opens tour.html on that
       room's panorama. The tour's back arrow returns to this page.
       Edit TOUR_URL if tour.html sits in a different folder.
    ===================================== */
    (function () {
      var TOUR_URL = "360s/index.html";

      /* plan room key -> tour panorama key (matched on room dimensions) */
      var ROOM_TO_PANORAMA = {
        living: "lobby",     /* Living & Dining  15'-10 1/2" x 22'-0" */
        kitchen: "kitchen",   /* Kitchen          11'-1"      x 8'-9"  */
        bed1: "dinning",   /* Master Bedroom   12'-0"      x 14'-5" */
        bed2: "room_3",    /* Bedroom 2        11'-0"      x 14'-0" */
        bed3: "room_2",    /* Bedroom 3        11'-0"      x 10'-0" */
        bed4: "room_1"     /* Bedroom 4        11'-0"      x 13'-4" */
      };

      /* the tour reads this for its balcony floor stack */
      var floorFromTitle = (document.title.match(/(\d+)/) || [])[1];
      if (floorFromTitle) {
        sessionStorage.setItem("selectedFloor", ("0" + floorFromTitle).slice(-2));
      }

      window.onRoomSelect = function (room) {
        if (!room) return;                    /* button was toggled off */
        var panorama = ROOM_TO_PANORAMA[room.key];
        if (!panorama) return;
        window.location.href = TOUR_URL + "?room=" + panorama;

      color: #fff;
      font-weight: 700;
      cursor: pointer
    }

    #eldeco-card .err {
      color: #b42318;
      font-size: 13px;
      min-height: 18px;
      margin: 8px 0
    }

    .unit-live {
      transition: fill .15s, stroke .15s, filter .15s
    }

    .unit-live:hover {
      filter: brightness(1.3) drop-shadow(0 0 8px rgba(255, 215, 0, .8))
    }
  </style>
  <div id="eldeco-lock">
    <div id="eldeco-card">
      <h2>Visitor Registration</h2>
      <p>Please enter your details to access the property.</p>
      <form id="eldecoVisitorForm"><input id="evName" placeholder="Name" required maxlength="120"><input id="evMobile"
          placeholder="Mobile number" inputmode="numeric" required><input id="evEmail" type="email"
          placeholder="Email (optional)"><input id="evCity" placeholder="City">
        <div id="evErr" class="err"></div><button id="evSubmit">Enter Website</button>
      </form>
    </div>
  </div>
  <script type="module">
    import { createClient } from 'https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2.111.0/+esm';
    const SUPABASE_URL = 'https://jpiudwptxzzgtgxtbnsa.supabase.co';
    const SUPABASE_KEY = 'sb_publishable_fJcnKZol-Xh_mSD9CORA5A_epWa097V';
    const supabase = createClient(SUPABASE_URL, SUPABASE_KEY);
    window.supabase = supabase;

    const lock = document.getElementById('eldeco-lock');
    const form = document.getElementById('eldecoVisitorForm');
    const err = document.getElementById('evErr');
    const evName = document.getElementById('evName');
    const evMobile = document.getElementById('evMobile');
    const evEmail = document.getElementById('evEmail');
    const evCity = document.getElementById('evCity');
    const evSubmit = document.getElementById('evSubmit');

    form.addEventListener('submit', async (e) => {
      e.preventDefault();
      err.textContent = '';
      const name = evName.value.trim();
      const mobile = evMobile.value.replace(/\D/g, '');
      const email = evEmail.value.trim() || null;
      const city = evCity.value.trim() || null;
      if (!name) { err.textContent = 'Please enter your name.'; return; }
      if (mobile.length < 10 || mobile.length > 15) { err.textContent = 'Enter a valid mobile number.'; return; }
      evSubmit.disabled = true;
      evSubmit.textContent = 'Entering...';
      const { error } = await supabase.from('visitors').insert({ name, mobile, email, city, source: 'eldeco-ipx' });
      if (error) {
        console.error('Visitor registration failed:', error);
        err.textContent = error.message || 'Unable to register. Please try again.';
        evSubmit.disabled = false;
        evSubmit.textContent = 'Enter Website';
        return;
      }
      sessionStorage.setItem('eldecoVisitor', JSON.stringify({ name, mobile, email, city }));
      lock.classList.add('hidden');
      document.body.classList.add('eldeco-unlocked');
    });

    let showAvailability = true;

    function updateAvailabilityButton() {
      const btn = document.getElementById('availabilityToggle'); if (!btn) return;
      btn.textContent = showAvailability ? 'Availability ON' : 'Availability OFF';
      btn.setAttribute('aria-pressed', String(showAvailability));
      btn.classList.toggle('off', !showAvailability);
    }
    function renderAvailability(el) {
      if (showAvailability && el.dataset.statusColor) {
        el.style.fill = el.dataset.statusColor; el.style.fillOpacity = '.45';
        el.style.stroke = el.dataset.statusColor; el.style.strokeOpacity = '.95';
      } else {
        el.style.fill = 'rgba(255,255,255,0.001)'; el.style.fillOpacity = '1';
        el.style.stroke = 'rgba(255,255,255,0.75)'; el.style.strokeOpacity = '1';
      }
    }
    async function applyInventory() {
      const [unitsResult, statusesResult] = await Promise.all([
        supabase.from('units').select('unit_number,svg_id,status_id,buyer_name,buyer_number'),
        supabase.from('status_categories').select('id,name,color').eq('active', true).order('sort_order')
      ]);
      if (unitsResult.error || statusesResult.error) { console.warn('Eldeco inventory load failed', unitsResult.error || statusesResult.error); return; }
      const units = unitsResult.data || [], statuses = statusesResult.data || [], statusMap = new Map(statuses.map(s => [s.id, s]));
      const legend = document.getElementById('legend');
      if (legend) {
        legend.innerHTML = '';
        if (showAvailability) statuses.forEach(status => {
          const item = document.createElement('span'); item.style.cssText = 'display:inline-flex;align-items:center;gap:6px';
          const swatch = document.createElement('i'); swatch.style.cssText = 'width:12px;height:12px;border-radius:3px;background:' + status.color;
          item.appendChild(swatch); item.appendChild(document.createTextNode(status.name)); legend.appendChild(item);
        });
      }
      document.querySelectorAll('#floorSVG .unit').forEach(el => {
        const unit = units.find(u => u.svg_id === el.id || u.unit_number === el.dataset.unit);
        const status = unit ? statusMap.get(unit.status_id) : null; el.classList.add('unit-live');
        delete el.dataset.status; delete el.dataset.statusColor; delete el.dataset.buyer; delete el.dataset.buyerNumber;
        if (status) { el.dataset.status = status.name; el.dataset.statusColor = status.color; el.dataset.buyer = unit.buyer_name || ''; el.dataset.buyerNumber = unit.buyer_number || ''; }
        renderAvailability(el);
      });
      updateAvailabilityButton();
    }
    document.getElementById('availabilityToggle').addEventListener('click', function () {
      showAvailability = !showAvailability;
      document.getElementById('legend')?.classList.toggle('availability-hidden', !showAvailability);
      document.querySelectorAll('#floorSVG .unit').forEach(renderAvailability); updateAvailabilityButton();
    });

    /* Bright hover outline while preserving each unit's live status color. */
    document.querySelectorAll('#floorSVG .unit').forEach(function (el) {
      el.addEventListener('mouseenter', function () {
        el.dataset.originalStrokeWidth = el.style.strokeWidth || '';
        el.style.strokeWidth = '7';
        el.style.filter = 'brightness(1.2) drop-shadow(0 0 7px rgba(255,215,0,.95)) drop-shadow(0 0 18px rgba(255,215,0,.65))';
      });
      el.addEventListener('mouseleave', function () {
        el.style.strokeWidth = el.dataset.originalStrokeWidth || '';
        el.style.filter = '';
      });
    });

    applyInventory();
    supabase.channel('eldeco-live')
      .on('postgres_changes', { event: '*', schema: 'public', table: 'units' }, applyInventory)
      .on('postgres_changes', { event: '*', schema: 'public', table: 'status_categories' }, applyInventory)
      .subscribe();
  </script>
</body>

</html>
